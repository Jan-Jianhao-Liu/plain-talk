<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 入门科普与前沿解读站</title>
<style>
  :root{
    --bg:#eef3fb;
    --panel:#ffffff;
    --ink:#0f2540;
    --ink-soft:#4a6485;
    --line:#d4e2f4;
    --accent:#1f6feb;
    --accent-soft:#e8f1ff;
    --shadow:0 6px 24px rgba(31,111,235,.10);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eaf1fc 0%,#eef3fb 40%,#f5f8fd 100%);
    color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px;
  }

  /* ---------- 三站互通顶部导航 ---------- */
  .sitenav{position:sticky;top:0;z-index:50;background:rgba(15,59,120,.96);
    backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(15,59,120,.25)}
  .sitenav .inner{max-width:1180px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;gap:10px;height:52px;flex-wrap:wrap}
  .sitenav .brand{color:#fff;font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}
  .sitenav .links{display:flex;gap:8px;flex-wrap:wrap}
  .sitenav a{color:#dceaff;text-decoration:none;font-size:13.5px;font-weight:600;
    padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);transition:all .2s;white-space:nowrap}
  .sitenav a:hover{background:#fff;color:var(--accent)}
  .sitenav a.cur{background:#fff;color:var(--accent);border-color:#fff}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header{
    background:linear-gradient(120deg,#0f3b78 0%,#1f6feb 60%,#3f8efc 100%);
    color:#fff;padding:34px 0 28px;position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(15,59,120,.25);
  }
  header::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-radius:50%;}
  .brand-h{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .brand-h .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.35);}
  .brand-h h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .brand-h .sub{font-size:13px;opacity:.85;font-weight:400;margin-top:2px}
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;position:relative;z-index:1}
  .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    border-radius:12px;padding:12px 18px;min-width:130px;backdrop-filter:blur(4px);}
  .stat .k{font-size:12px;opacity:.85;letter-spacing:.5px}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v small{font-size:12px;font-weight:400;opacity:.85}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative;z-index:1}
  .legend .lab{font-size:12px;opacity:.85;align-self:center;margin-right:2px}
  .legend .chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);}

  /* 筛选 + 搜索 */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin:26px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters .flab{font-size:12px;color:var(--ink-soft);margin-right:2px}
  .tagbtn{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .2s;user-select:none}
  .tagbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tagbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;min-width:230px}
  .searchbox input{border:none;outline:none;font-size:13.5px;font-family:inherit;flex:1;color:var(--ink);background:transparent}
  .searchbox .ic{color:var(--ink-soft);font-size:14px}

  .layout{display:flex;gap:30px;margin-top:22px;align-items:flex-start}
  .timeline{flex:0 0 210px;position:sticky;top:70px;align-self:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;box-shadow:var(--shadow);}
  .timeline h2{font-size:13px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:16px;font-weight:600}
  .rail{position:relative;padding-left:22px}
  .rail::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .node{position:relative;padding:10px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;transition:background .15s ease}
  .node:hover{background:var(--accent-soft)}
  .node:hover .d{color:var(--accent)}
  .node.active{background:var(--accent-soft)}
  .node.active .d{color:var(--accent)}
  .node.active .dot{background:#fff;box-shadow:0 0 0 2px var(--accent)}
  .node .dot{position:absolute;left:-14px;top:14px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
  .node .d{font-size:14px;font-weight:700;color:var(--ink)}
  .node .w{font-size:12px;color:var(--ink-soft)}
  .node .c{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px}

  .content{flex:1;min-width:0}
  .day-block{margin-bottom:14px}
  .day-label{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;padding-left:4px}
  .day-label .dl-date{font-size:17px;font-weight:700;color:var(--ink)}
  .day-label .dl-week{font-size:13px;color:var(--ink-soft)}
  .day-label .dl-count{font-size:12px;color:var(--accent);background:var(--accent-soft);
    padding:2px 10px;border-radius:20px;font-weight:600}

  .sub-h{display:flex;align-items:center;gap:8px;margin:18px 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
  .sub-h .bar{width:4px;height:18px;border-radius:3px;background:var(--accent);display:inline-block}
  .sub-h .cnt{font-size:12px;color:var(--ink-soft);font-weight:500}
  .module-h{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;
    color:var(--ink);margin:34px 0 18px;padding-bottom:12px;border-bottom:2px solid var(--line)}
  .module-h .ico{flex:0 0 38px;height:38px;border-radius:11px;background:var(--accent-soft);
    display:grid;place-items:center;font-size:19px}
  .module-h .desc{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .module-h .cnt{margin-left:auto;font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    padding:4px 12px;border-radius:20px;font-weight:700;white-space:nowrap}

  /* 科普卡 */
  .scard{background:var(--panel);border:1px solid var(--line);border-left:4px solid #2f9e6e;
    border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .scard.visible{opacity:1;transform:none}
  .scard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .scard .num{flex:0 0 28px;height:28px;border-radius:9px;background:#e6f7ef;color:#2f9e6e;
    font-weight:700;display:grid;place-items:center;font-size:13px;}
  .badge{font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;border:1px solid;white-space:nowrap}
  .badge.domain{background:#fff4e6;color:#b45309;border-color:#fcd9a8}
  .badge.level{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
  .scard h3{font-size:16px;font-weight:700;line-height:1.45;margin:4px 0 8px;color:var(--ink)}
  .scard p{font-size:14px;color:#33485f;line-height:1.75;margin-bottom:10px}
  .scard .diagram{background:#f6f9ff;border:1px dashed var(--line);border-radius:10px;
    padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;white-space:pre-wrap}
  .scard .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .scard a.link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
    border:1px solid var(--accent);padding:6px 14px;border-radius:9px;transition:all .2s;}
  .scard a.link:hover{background:var(--accent);color:#fff}

  /* 解读卡 */
  .ncard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .ncard.visible{opacity:1;transform:none}
  .ncard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ncard .num{flex:0 0 28px;height:28px;border-radius:9px;background:var(--accent-soft);
    color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px;}
  .ncard .badge.src{background:hsl(var(--h),72%,94%);color:hsl(var(--h),55%,32%);border-color:hsl(var(--h),55%,84%)}
  .ncard h3{font-size:16px;font-weight:700;line-height:1.45;margin:4px 0 8px;color:var(--ink)}
  .ncard .label{font-size:13px;font-weight:700;color:#0f3b78;margin:10px 0 4px;display:flex;align-items:center;gap:6px}
  .ncard .interpret{font-size:14px;color:#33485f;line-height:1.8}
  .ncard .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
  .ncard .src{font-size:12px;color:var(--ink-soft)}
  .ncard a.link{font-size:13px;font-weight:600;color:#fff;background:#0f3b78;text-decoration:none;
    border:1px solid #0f3b78;padding:6px 14px;border-radius:9px;transition:all .2s;}
  .ncard a.link:hover{background:var(--accent);border-color:var(--accent)}
  .ncard a.link.sub{font-size:12px;padding:5px 11px;opacity:.9}

  .empty{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:40px;line-height:1.8}
  @media(max-width:860px){
    .layout{flex-direction:column}
    .timeline{position:static;flex:none;width:100%}
    .rail{display:flex;gap:6px;overflow-x:auto;padding-left:0;padding-bottom:6px}
    .rail::before{display:none}
    .node{padding:6px 4px;margin:0;flex:0 0 auto;text-align:center}
    .node .dot{display:none}
    .toolbar{flex-direction:column;align-items:stretch}
    .searchbox{width:100%}
  }
</style>
</head>
<body>
<nav class="sitenav">
  <div class="inner">
    <span class="brand">🔬 AI 科普站</span>

<header>
  <div class="wrap">

      <div class="logo">🤖</div>

        <h1>AI 入门科普与前沿解读站</h1>

      </div>

</header>

<div class="wrap">

      <span class="flab">领域筛选：</span>

      <span class="ic">🔍</span>
      <input id="search" type="text" placeholder="搜索科普 / 解读关键词…" />
    </div>
  </div>

  <div class="layout">
    <aside class="timeline">

      <div class="rail" id="rail"></div>
    </aside>
    <main class="content" id="content"></main>
  </div>
  <footer id="footer"></footer>
</div>

<script>
const DATA = {"science": [{"id": "sci-2026-08-25-1", "domain": "AI Agent", "title": "【入门科普】什么是对齐（Alignment）？让 AI 行为符合人类价值观", "level": "入门", "body": "想象一下，你雇佣了一个超级聪明但只懂字面意思的实习生（AI）。你给他一份作业：'帮我找一只最可爱的猫。'他会把所有猫的图片全印出来，因为猫都可爱。但你的真实意图其实是：'帮我找一只适合孩子玩耍、性格温顺的橘猫。'\n\n这就是'对齐'的问题。简单的指令往往藏着复杂的人类价值观，如果 AI 不懂，他可能会好心办坏事。\n\n'对齐'就像是给这个实习生装上一个'价值观过滤器'或'人类模拟器'。它不仅仅是让 AI 听懂你的字面话，还要让他理解你背后的感受、道德判断和真实需求。比如，不仅要是'好心的'，还要是'有同理心的'。只有完成了这个'对齐'过程，AI 才不再是只会机械执行命令的工具，而是真正愿意做正确事情、符合人类期待的伙伴。", "diagram": "人类意图（模糊且复杂） --> [价值观对齐层] --> 清晰指令 --> 执行者 AI", "link": "", "date": "2026-08-25", "weekday": "周二"}, {"id": "sci-2026-08-25-2", "domain": "AI Agent", "title": "【入门科普】什么是推理模型？AI 的'慢思考'与思维链（CoT）", "level": "入门", "body": "以前有些 AI 像是一个反应极快的'闪电侠'，你问它'苹果是水果吗？'，它会在 0.1 秒内直接给出答案。这叫'预训练模型'，擅长记背知识。\n\n但现在的'推理模型'更像是一个爱钻牛角尖的'哲学家'或'解题教练'。它不会直接跳答案，而是先在心里把自己问一遍：'为什么是水果？什么才算水果？苹果长得像什么？它在树上吗？'\n\n这个过程就叫'思维链'（CoT, Chain of Thought）。你可以把它想象成 AI 在脑子里画了一幅'思考的流程图'。它不是靠死记硬背的数据库里的现成答案，而是像人类做数学题一样，把大问题拆成小步骤，一步步推演。\n\n虽然这种'慢思考'会让回答稍微慢一点，多消耗一点计算量，但它能处理以前 AI 搞不定的难题，比如复杂的逻辑谜题、多步骤的规划，或者理解隐含的因果关系。", "diagram": "问题输入 --> 拆解步骤（思维链） --> 逐步推演 --> 最终答案", "link": "", "date": "2026-08-25", "weekday": "周二"}, {"id": "sci-2026-08-20-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI Agent？", "level": "入门", "body": "如果把普通的聊天大模型比作只会背诵课文的学生，那么 AI Agent 就是一位带着笔记本、书包和工具箱的实习实习生。普通大模型只能被动等待你问它问题，答完即止；而 AI Agent 不仅能回答，还能自己主动规划路线。当你说‘帮我规划周末去海边玩’时，Agent 不会只给你一段文字，它会先思考（规划），记得你之前不喜欢住酒店（记忆），然后自己打电话订房、查机票、甚至帮你在网上买票（工具调用）。它更像是一个能自主执行复杂任务的管家，帮你把‘想要结果’这个目标一步步变成现实。", "diagram": "用户下任务 -> Agent 思考规划 -> 调用记忆 + 使用工具 -> 执行动作 -> 完成结果", "link": "", "date": "2026-08-20", "weekday": "周四"}, {"id": "sci-2026-08-20-2", "domain": "AI Agent", "title": "【入门科普】Agent 三大核心模块", "level": "入门", "body": "AI Agent 之所以能干大事，全靠体内装着的三大核心模块：记忆、规划和工具。记忆就像大脑里的回忆录，它负责把过去的经历存下来，比如你告诉过它‘明天有重要会议’，下次它就能提前提醒，不用你重复说；规划则是大脑里的指挥棒，面对复杂任务时，它能像导演排戏一样，把大目标拆解成一个个小步骤，按顺序执行；工具调用则是手脚，当遇到模型算不出的题或无法直接做的事情（比如搜天气、画图表）时，它会伸手去拿旁边的工具包来解决问题。只有这三者配合默契，Agent 才能从‘聊天机器人’进化成‘全能助手’。", "diagram": "记忆（存回忆）+ 规划（画路线图）+ 工具（伸手干活） = Agent 自动执行", "link": "", "date": "2026-08-20", "weekday": "周四"}, {"id": "sci-2026-08-21-1", "domain": "AI Agent", "title": "【入门科普】什么是大模型？它怎么‘理解’语言", "level": "入门", "body": "把大模型想象成一个读过海量书籍、电影和新闻的‘超级记忆员’。它没有真正的‘大脑’或‘意识’，也不是在死记硬背每个句子的意思。它的理解方式更像是一个‘拼图高手’：看到文字，它先不管句子的逻辑，只关心每个词是由哪些更小的符号（字母、词根）拼出来的。比如它看到‘猫’，脑子里立刻浮现出一万个关于猫的图像：毛茸茸、会叫、有九个命门。当你在它面前输入一句话时，它其实是把这句话拆成无数个小碎片，和它在训练时见过的千万个小碎片进行比对，找出最相似的图像、声音和概念，然后把它们重新组合成你需要的回答。它不懂‘为什么’，但它知道‘是什么样’，所以它生成的回答往往很像人话，却未必真懂道理。", "diagram": "输入文字 -> 拆解为小碎片 -> 匹配海量记忆库中的图像/概念 -> 重新组合成输出", "link": "", "date": "2026-08-21", "weekday": "周五"}, {"id": "sci-2026-08-21-2", "domain": "AI Agent", "title": "【入门科普】什么是指令？写好提示词的核心技巧", "level": "入门", "body": "指令（Prompt）就像是你给超级记忆员布置任务的‘口头通知’。如果光说‘帮我写首诗’，它可能会给你一首乱糟糟的打油诗；但如果你说‘请写一首五言绝句，描写深秋清晨的竹林，要带一点孤寂感’，它的表现就截然不同。写好提示词的核心技巧有三点：一是‘给角色’，比如让你‘像一位严厉的老教师’说话，它能立刻切换语气；二是‘给例子’，比如‘就像这样：...’，它能快速模仿风格；三是‘定范围’，比如‘只讲三件事’或‘不要用成语’，它能防止跑题。记住，大模型很听话但也很容易晕，你给它的信息越清晰、结构越完整，它就越能猜到你的心思，而不是让你猜它的心思。", "diagram": "模糊指令 -> 猜测回答 -> 清晰指令（角色+例子+限制）-> 精准回答", "link": "", "date": "2026-08-21", "weekday": "周五"}, {"id": "sci-2026-08-22-1", "domain": "AI Agent", "title": "【入门科普】RAG（检索增强生成）：让 AI 先查资料再回答", "level": "入门", "body": "你可以把 RAG 想象成一位聪明的“随身秘书”。普通的 AI 就像只读过有限书籍的学生，遇到生疏话题容易说错话或瞎编。而启用 RAG 的 AI，在开口回答前，会先扮演侦探的角色，去网上搜素最新的新闻、文档或书籍，把相关 facts 搜集起来。它先把这些新资料读一遍，提取关键信息，然后结合自己的知识库进行回答。就像你遇到不懂的菜式，先查菜谱确认食材，再告诉你是怎么做的，而不是凭空想象。", "diagram": "AI 先像侦探一样查资料，再把资料喂给自己，最后结合信息回答问题", "link": "", "date": "2026-08-22", "weekday": "周六"}, {"id": "sci-2026-08-22-2", "domain": "AI Agent", "title": "【入门科普】向量数据库：AI 如何记住语义相似度", "level": "入门", "body": "传统数据库像是按字母索书的图书馆，找“苹果”就找“苹”字那一排，而 AI 需要的是“语义理解”。向量数据库就是 AI 的“大脑皮层”，它不把文字按字母排列，而是把“苹果”、“水果”、“红色”这些词都转化成一个长长的数字坐标点（向量）。神奇的是，如果在“苹果”和“红色”的坐标点上，它们距离很近，而距离“香蕉”很远。当 AI 想找你想要的东西时，它不会去字母表里翻，而是直接计算哪个数字坐标离目标最近，从而找到语义最相似的词。", "diagram": "把词语变成数字坐标，距离近的就是意思相似的词", "link": "", "date": "2026-08-22", "weekday": "周六"}, {"id": "sci-2026-08-23-1", "domain": "AI Agent", "title": "【入门科普】什么是微调（Fine-tuning）？让通用模型学会专长", "level": "入门", "body": "想象你有一台超级聪明的全能厨师（通义千问），什么菜都能做，但还没法专门做出‘米其林三星法式大餐’。这时，你不需要给它重新造一个大脑，只需要给它看一万道正宗法餐菜谱，并且边看边说：‘这道菜要更精致’‘那个酱汁要更浓’。这个过程就叫微调。它不改变厨师原本的底料配方，只是通过大量的专业训练，让厨师记住并掌握新的烹饪技巧，从此能像专业大厨一样，精准地做出你需要的法式大餐。", "diagram": "通用厨师 + 大量专业菜谱 = 精通专长的专家厨师", "link": "", "date": "2026-08-23", "weekday": "周日"}, {"id": "sci-2026-08-23-2", "domain": "AI Agent", "title": "【入门科普】什么是 Embedding？把文字变成可计算的数字向量", "level": "入门", "body": "电脑原本只能处理数字，看不懂文字，就像一个人只会算数却不会说话。为了让电脑理解‘猫’和‘狗’有关系，我们需要给它们一种翻译。Embedding 就是给每个单词穿上一件‘数字衣服’。比如‘猫’变成一串特定的数字，‘狗’变成另一串，而‘猫’和‘狗’这俩数字里会有相同的模式，就像它们都有一条腿一样。这样，当电脑看到这两个数字时，就能明白它们彼此相似，进而进行计算、匹配和推理，把模糊的文字变成了清晰的数学语言。", "diagram": "文字（如猫、狗） -> 变成一串数字（向量） -> 电脑即可进行数学运算", "link": "", "date": "2026-08-23", "weekday": "周日"}, {"id": "sci-2026-08-24-1", "domain": "AI Agent", "title": "【入门科普】什么是多模态 AI？让模型同时看懂图、听懂话、读文档", "level": "入门", "body": "想象以前的人眼观六路：眼睛能看画、耳朵能听歌、手能摸文字，大脑分别处理这些信息。多模态 AI 就像个超级通才，它把眼睛、耳朵和手的功能合并在一个人身上。以前它只能看或只能听，现在能像人一样，一边看着图画，一边听着你的问题，再翻翻手里的资料，最后把所有线索拼在一起回答。就像你能指着图问‘这是谁？’，它不仅能认出那个脸，还能结合你提供的背景故事和文件内容，给你一个完整的解答，这就是多模态的能力。", "diagram": "把眼睛、耳朵、手的信息流汇聚到大脑里进行综合分析", "link": "", "date": "2026-08-24", "weekday": "周一"}, {"id": "sci-2026-08-24-2", "domain": "AI Agent", "title": "【入门科普】什么是幻觉（Hallucination）？AI 为什么会一本正经胡说", "level": "入门", "body": "‘幻觉’这个词听起来像精神病，但在 AI 里指它瞎编故事。这不像人类撒谎有目的，更像是‘脑补’过头。因为训练时 AI 只见过有限的资料，面对新问题时，它像填字游戏一样试图匹配前文。如果前句说‘小明昨天去公园’，它可能会下意识脑补出‘小明带了只恐龙’，然后自信满满地告诉你。这并非它在欺骗，而是它没见过真实案例，就凭概率瞎凑出一套逻辑自洽的谎话，让你听了觉得特别在理。", "diagram": "AI 根据已知碎片随意拼接，编造出看似合理却完全虚构的内容", "link": "", "date": "2026-08-24", "weekday": "周一"}, {"id": "sci-2026-08-26-1", "domain": "AI Agent", "title": "【入门科普】什么是 MCP（模型上下文协议）？Agent 连接工具的统一标准", "level": "入门", "body": "如果把 AI 代理（Agent）比作一个刚学会打工的年轻人，而各种工具（比如计算器、天气预报、搜索网）则是不同的老板要求它去做的杂活，MCP（模型上下文协议）就是这位年轻人和所有老板之间统一的‘普通话’。\n\n在过去，这位年轻人可能听不懂计算器的方言，也不懂天气系统的黑话，每次都要重新学习才能去干活，效率极低。MCP 的出现，相当于建立了一套通用的语言手册。它规定了 AI 在询问工具时该说什么，在拿到工具的回答后该怎么说，甚至如何处理错误。\n\n有了 MCP，AI 就能像熟练工人一样，不管面对的是查天气的‘小气’工具还是算数学的‘硬核’工具，都能用一套标准的沟通方式顺畅协作。这不仅让 AI 能轻松调用成百上千种软件，还让它们之间能互相分享信息，形成合力，真正实现了‘千工具一通用’的便捷连接。", "diagram": "AI 通过统一的‘普通话’（MCP），轻松听懂并使用各种不同‘方言’的工具，实现高效协作。", "link": "", "date": "2026-08-26", "weekday": "周三"}, {"id": "sci-2026-08-26-2", "domain": "AI Agent", "title": "【入门科普】什么是 AI 工作流（Workflow）？把多个步骤串成自动化", "level": "入门", "body": "想象你要给一家餐厅设计一个‘点餐送饭’的超级智能系统，这可不是让 AI 一个人盯着干完，而是要把它拆解成一个个清晰的指令步骤，这就是 AI 工作流的核心。\n\n它就像是一个精密的流水线：第一步，AI 先‘听’到顾客点的菜（数据输入）；第二步，它立刻联系后厨的‘厨师’（调用工具）把菜做好；第三步，通知‘送货员’（发送通知）去门口；最后，‘送货员’把菜送到顾客手里（完成输出）。\n\n如果每一步都出错怎么办？工作流会自动检查，比如菜没做好就先不发货，而是报警重试。它把复杂的任务拆解成一个个简单的动作，按顺序自动执行，中间不需要人盯着。这就好比给生活装上了‘自动导航’，只要设定好起点和终点，以及中间的每一步动作，AI 就能从头到尾一气呵成地帮你搞定大事。", "diagram": "AI 像流水线一样：听指令 -> 调工具处理 -> 传信息 -> 完成任务，全程自动循环。", "link": "", "date": "2026-08-26", "weekday": "周三"}, {"id": "sci-2026-08-27-1", "domain": "AI Agent", "title": "【入门科普】知识图谱：让 AI 拥有社交网络的大脑", "level": "入门", "body": "想象一下，知识图谱就像是一个巨大的、活着的社交网络。在这个网络里，每个人（节点）都是某个知识概念，比如'苹果'、'牛顿'或'重力'。当两个'人'认识时，他们之间就画了一条线（关系），比如'苹果'和'牛顿'之间连着'发明了'这条线，'牛顿'和'重力'之间连着'解释了'这条线。\n\n这种结构让 AI 不再只是死记硬背孤立的单词，而是能看懂事情之间的前后因果。如果你问 AI'谁发现了苹果落地的现象'，它不仅能回答'牛顿'，还能顺藤摸瓜，告诉你牛顿还发现了万有引力，因为在他的社交圈里，这两个概念是紧紧相连的。知识图谱就是给 AI 构建了一套逻辑清晰的家族谱，让它在理解世界时更有条理。", "diagram": "概念 A --(关系)--> 概念 B --(关系)--> 概念 C，像一张连成网的关系地图", "link": "", "date": "2026-08-27", "weekday": "周四"}, {"id": "sci-2026-08-27-2", "domain": "AI Agent", "title": "【入门科普】强化学习：像孩子试错一样自我修正", "level": "入门", "body": "强化学习就像是在教一个孩子学骑车。一开始，孩子可能会摔得头破血流，但他每次摔倒后，大人会给一个'红牌'（惩罚）或者'绿灯'（奖励）。\n\n如果孩子这次没摔，大人就夸他'真棒'（正反馈），下次他就会更愿意保持平衡去尝试；如果摔倒了，大人就会摇头表示'不行'（负反馈），他就会下次避开那个姿势。AI 的强化学习过程完全一样：它没有固定的教科书，而是通过自己在环境中不断'试错'，记录哪些行为带来了'奖励'，哪些招致了'惩罚'，逐渐总结出最优策略。\n\n这种学习方式不需要预先知道所有答案，只需要知道'做什么是对的'，就像孩子通过无数次跌撞，最终掌握了骑车的核心技巧。", "diagram": "AI 尝试动作 -> 收到奖励/惩罚 -> 更新经验 -> 下次做出更好的动作，循环往复", "link": "", "date": "2026-08-27", "weekday": "周四"}, {"id": "sci-2026-08-28-1", "domain": "AI Agent", "title": "【入门科普】Transformer：现代大模型的骨架", "level": "入门", "body": "如果把训练大模型比作教一个学生从识字到写小说，Transformer 就是那个让学生能同时盯着整本书读（而不是只看一句一句）的核心方法。它最神奇的魔法是\"注意力机制\"：想象你在看一部电影，Transformer 能让每个字都去关注其他相关的字，比如把“猫”字和后面出现的“宠物”联系起来。传统模型像是一个接一个处理信息的流水线工人，而 Transformer 更像是一个拥有全局视野的指挥官，它让数据之间能自由交流、互相理解，从而让模型学会如何从海量信息中提炼出深层逻辑，这是如今所有大型 AI 模型能听懂人话、写代码的基石。", "diagram": "所有单词通过“注意力”互相连接，形成一个巨大的信息网络", "link": "", "date": "2026-08-28", "weekday": "周五"}, {"id": "sci-2026-08-28-2", "domain": "AI Agent", "title": "【入门科普】如何评测 AI？常用指标与基准测试", "level": "入门", "body": "要衡量一个 AI 到底聪明不聪明，就像考医生一样需要看多种“成绩单”，而单一分数往往不准。最常用的方法是“基准测试”，相当于给 AI 出几套不同难度的考题，比如数学题、看图说话题或逻辑推理题。我们会看几个关键指标：准确率（答对的比例）、鲁棒性（遇到新花样会不会乱套）以及公平性（对待不同人是否一视同仁）。有些考试只考解题速度，但真正聪明的 AI 还需要具备“常识”，知道水往低处流这类简单道理。只有通过多种场景下的综合演练，我们才能真正了解它的真实水平，而不是被某个单一的高分骗了。", "diagram": "AI 参加多场不同领域的考试，综合评分决定最终等级", "link": "", "date": "2026-08-28", "weekday": "周五"}, {"id": "sci-2026-08-29-1", "domain": "AI Agent", "title": "【入门科普】边缘 AI：把模型跑在手机和摄像头里", "level": "入门", "body": "如果把 AI 比作一个只会读书但不会动手的‘超级学霸’，传统 AI 就是把这本书存放在云端的大图书馆里，用户需要联网才能问问题或看照片。而‘边缘 AI'则是把这学霸的脑子和书包都搬到了你自己的手机、手表或摄像头里。现在你拍一张猫的照片，手机自己就能认出它是猫，不需要联网去云端求教；你调整空调温度，墙壁里的传感器自己就能计算好设定。这就是边缘 AI，它让 AI 具备了‘离线思考’的能力，像给普通设备装了一个微型大脑，随时能处理眼前的小事。", "diagram": "云端大图书馆（传统 AI） vs 随身携带的微型脑（边缘 AI，本地直接处理）", "link": "", "date": "2026-08-29", "weekday": "周六"}, {"id": "sci-2026-08-29-2", "domain": "AI Agent", "title": "【入门科普】具身智能：给 AI 一个身体去真实行动", "level": "入门", "body": "目前大家熟悉的 AI 大多还住在‘屏幕’或‘键盘’这种虚拟空间里，只能处理数字。而‘具身智能’是给 AI 装上一个真实的‘机器人身体’，让它能感知温度、听到哭声、推得动箱子。就像小时候学走路的孩子，他必须通过手脚乱碰、摔跟头来学会走路，AI 也是如此。它不再只是计算数据，而是必须通过真实的物理行动（比如伸手拿杯子、避开路上的石头）来学习。当 AI 拥有身体后，它才能理解‘重’、‘冷’、‘触’这些抽象概念，从‘知道’真正进化到‘懂得’。", "diagram": "屏幕里的 AI（只能看图说话） vs 拥有四肢和五官的机器人 AI（通过触摸和行走学习）", "link": "", "date": "2026-08-29", "weekday": "周六"}, {"id": "sci-2026-08-31-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI Agent？", "level": "入门", "body": "如果把普通的大模型聊天机器人比作一个只会回答问题的‘图书管理员’，而 AI Agent 就是一个拥有行动能力的‘全能管家’。普通模型只是在你问问题时机械地给出一个答案；而 AI Agent 不一样，它能理解你的任务目标，自己想办法拆解步骤，就像它会先查一下你的日程表，再去买票，最后帮你订好酒店。它能记住之前说过的话，也能调动各种外部工具（比如搜索、画图、写代码）来帮你完成那些光靠嘴说解决不了的大任务。", "diagram": "人提问 -> Agent 自主拆解任务 -> 调用工具执行 -> 反馈结果", "link": "", "date": "2026-08-31", "weekday": "周一"}, {"id": "sci-2026-08-31-2", "domain": "AI Agent", "title": "【入门科普】Agent 三大核心模块", "level": "入门", "body": "AI Agent 之所以聪明，靠的是三个核心模块的协同工作。首先是‘记忆’，就像给管家一本厚厚的笔记，它能记住你以前说过‘喜欢喝咖啡’或者‘住在北京’，下次不用你重复。其次是‘规划’，这相当于管家的脑子里有一个‘导演’，它能把你模糊的‘我要旅行’变成详细的‘先买票、再订房、最后打车’的剧本。最后是‘工具调用’，这是管家手中的‘工具箱’，里面装着搜索、画图、写代码等各种技能，遇到具体事情就顺手拿起来用。", "diagram": "记忆（笔记）+ 规划（导演剧本）+ 工具（工具箱）= Agent", "link": "", "date": "2026-08-31", "weekday": "周一"}], "news": [{"id": "news-2026-08-24-1", "domain": "LLM", "title": "阿里云 Wan 3.0 上线 Runware D0", "source": "X：阿里云 / Alibaba Cloud (@alibaba_cloud)", "sourceUrl": "https://x.com/alibaba_cloud/status/2091807371224117597", "interpret": "阿里云视频生成模型 Wan 3.0 上线 Runware 的 D0 推理节点，意味着开发者可通过 Runware 的 API 直接调用这款国产视频大模型。视频生成正快速「基础设施化」：模型厂负责质量，推理平台负责随时可用、按量计费。对创作者：低成本试错视频广告、短剧成为可能；对行业：视频模型的竞争焦点从「能不能生成」转向「稳不稳定、贵不贵、接不接得住」，推理层的地位愈发关键。", "hue": 207, "date": "2026-08-24", "weekday": "周一"}, {"id": "news-2026-08-24-2", "domain": "AI Agent", "title": "DeepSeek V4-Flash-Vision-Exp 平价平替 Claude Code", "source": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2091805785340686430", "interpret": "DeepSeek 推出 V4-Flash-Vision-Exp，主打以平价提供类 Claude Code 的编程智能体体验，并支持视觉输入。在 Claude Code 因订阅成本被诟病之际，这款实验模型瞄准「高性价比编码 Agent」空白：既能读图理解 UI / 报错，又能写改代码。对开发者：多了一个省钱且能视觉交互的选择；对行业：编码 Agent 正从「奢侈品」变成「平价基础设施」，会进一步压低软件开发的边际成本。", "hue": 225, "date": "2026-08-24", "weekday": "周一"}, {"id": "news-2026-08-24-3", "domain": "具身智能", "title": "宇树科技股价收跌 10.31%，市值被 Figure AI 反超跌至全球人形机器人榜第二", "source": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/993/591.htm", "interpret": "宇树科技股价收跌 10.31%，全球人形机器人市值排名跌至第二，被 Figure AI 反超。这反映资本市场对具身智能的定价正在分化：一边是量产与营收兑现，一边是估值回调。对行业：说明「谁先规模化交付」比「谁演示更炫」更能决定身价；对观察者：机器人板块进入洗牌期，技术路线（液压 / 电机、端到端 / 模块化）与商业化节奏将直接反映在市值上。", "hue": 227, "date": "2026-08-24", "weekday": "周一"}, {"id": "news-2026-08-24-4", "domain": "AI认知算法", "title": "2026年最佳GPU Neocloud排名：CoreWeave、Nebius、Lambda、Crusoe与Groq按公开定价和签约电力对比", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/08/23/best-gpu-neoclouds-2026", "interpret": "MarkTechPo document.getElementById('stats').innerHTML = `
  <div class="stat"><div class="k">累计科普条目</div><div class="v">${DATA.science_count} <small>条</small></div></div>
  <div class="stat"><div class="k">累计解读周期</div><div class="v" style="font-size:16px">${DATA.first_date} <small>至</small> ${DATA.last_date}</div></div>
  <div class="stat"><div class="k">覆盖天数</div><div class="v">${DATA.days} <small>天</small></div></div>
  <div class="stat"><div class="k">覆盖领域</div><div class="v">${DATA.domains.length} <small>个</small></div></div>
  <div class="stat"><div class="k">累计解读</div><div class="v">${DATA.news_count} <small>篇</small></div></div>
`;
document.getElementById('legend').innerHTML =
  '<span class="lab">领域：</span>' + DATA.domains.map(d=>`<span class="chip">${d}</span>`).join('');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 领域筛选按钮
const filtersEl = document.getElementById('filters');
let activeDomain = '全部';
const domainBtns = [{d:'全部'}].concat(DATA.domains.map(d=>({d})));
domainBtns.forEach(({d})=>{
  const b = document.createElement('span');
  b.className = 'tagbtn' + (d==='全部'?' on':'');
  b.textContent = d;
  b.onclick = ()=>{ activeDomain = d; document.querySelectorAll('.tagbtn').forEach(x=>x.classList.remove('on')); b.classList.add('on'); render(); };
  filtersEl.appendChild(b);
});

const rail = document.getElementById('rail');
rail.innerHTML = DATA.timeline.map(t=>`
  <div class="node" data-target="day-${t.date}" title="点击跳转到 ${t.date} 的内容">
    <span class="dot"></span>
    <div class="d">${t.date.slice(5)}</div>
    <div class="w">${t.weekday}</div>
    <div class="c">${t.count} 条</div>
  </div>`).join('');

const weekOf = {};
DATA.timeline.forEach(t=>weekOf[t.date]=t.weekday);

// 按日期聚合
const sciByDay = {}; DATA.science.forEach(r=>{ (sciByDay[r.date]=sciByDay[r.date]||[]).push(r); });
const newsByDay = {}; DATA.news.forEach(r=>{ (newsByDay[r.date]=newsByDay[r.date]||[]).push(r); });
const allDays = Array.from(new Set([...Object.keys(sciByDay), ...Object.keys(newsByDay)]))
  .sort((a,b)=>b.localeCompare(a));

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', render);

function matchDomain(r){ return activeDomain==='全部' || r.domain===activeDomain; }
function matchKw(r, kw){
  if(!kw) return true;
  const hay = [r.title, r.domain, r.body||'', r.interpret||'', r.source||''].join(' ').toLowerCase();
  return hay.includes(kw.toLowerCase());
}

function sciCard(r, i){
  const dia = r.diagram ? `<div class="diagram">${esc(r.diagram)}</div>` : '';
  const ext = r.link ? `<a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">相关论文 →</a>` : '';
  return `<article class="scard" data-dom="${esc(r.domain)}">
    <div class="top">
      <span class="num">${i}</span>
      <span class="badge domain">${esc(r.domain)}</span>
      <span class="badge level">${esc(r.level||'入门')}</span>
    </div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    ${dia}${ext?`<div class="foot">${ext}</div>`:''}
  </article>`;
}

function newsCard(r, i){
  const srcUrl = r.sourceUrl ? `<a class="link" href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">阅读原文 ↗</a>` : '';
  return `<article class="ncard" data-dom="${esc(r.domain)}">
    <div class="top">
      <span class="num">${i}</span>
      <span class="badge domain">${esc(r.domain)}</span>
      <span class="badge src" style="--h:${r.hue}">${esc(r.source||'AI 资讯')}</span>
    </div>
    <h3>${esc(r.title)}</h3>
    <div class="label">💡 通俗解读</div>
    <div class="interpret">${esc(r.interpret)}</div>
    <div class="foot">
      <span class="src">来源：${esc(r.source||'—')}</span>
      ${srcUrl}
    </div>
  </article>`;
}

const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
},{threshold:0.1});

function render(){
  const kw = searchEl.value.trim();
  const content = document.getElementById('content');
  const sciDays = Object.keys(sciByDay).sort((a,b)=>b.localeCompare(a));
  const newsDays = Object.keys(newsByDay).sort((a,b)=>b.localeCompare(a));
  let sciHtml = '', newsHtml = '', sciN = 0, newsN = 0;

  sciDays.forEach(day=>{
    const list = (sciByDay[day]||[]).filter(r=>matchDomain(r)&&matchKw(r,kw));
    if(!list.length) return;
    sciN += list.length;
    sciHtml += `<section class="day-block" id="sci-day-${day}">
      <div class="day-label">
        <span class="dl-date">${day}</span>
        <span class="dl-week">${weekOf[day]||''}</span>
        <span class="dl-count">${list.length} 条</span>
      </div>${list.map((r,i)=>sciCard(r,i+1)).join('')}</section>`;
  });
  newsDays.forEach(day=>{
    const list = (newsByDay[day]||[]).filter(r=>matchDomain(r)&&matchKw(r,kw));
    if(!list.length) return;
    newsN += list.length;
    newsHtml += `<section class="day-block" id="news-day-${day}">
      <div class="day-label">
        <span class="dl-date">${day}</span>
        <span class="dl-week">${weekOf[day]||''}</span>
        <span class="dl-count">${list.length} 条</span>
      </div>${list.map((r,i)=>newsCard(r,i+1)).join('')}</section>`;
  });

  if(!sciN && !newsN){
    content.innerHTML = `<div class="empty">没有匹配的条目，换个关键词或领域试试～</div>`;
    rail.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
    return;
  }

  content.innerHTML =
    `<div class="module-h"><span class="ico">📘</span><div>AI Agent 入门科普
       <div class="desc">循序渐进：概念 → 架构 → 工具 → 实战 · 每日 1-2 条</div></div>
       <span class="cnt">${sciN} 条</span></div>${sciHtml}
     <div class="module-h"><span class="ico">📰</span><div>每日 5 条新闻 &amp; 解读
       <div class="desc">精选当日 AI 行业 / 产品热点 · 通俗解读 · 附原文链接</div></div>
       <span class="cnt">${newsN} 条</span></div>${newsHtml}`;

  document.querySelectorAll('.scard,.ncard').forEach(c=>io.observe(c));

  // 时间轴点击跳转：优先跳科普模块的日期块，否则跳新闻模块
  rail.querySelectorAll('.node').forEach(n=>{
    const d = n.dataset.target.replace(/^day-/,'');
    n.onclick = ()=>{
      const el = document.getElementById('sci-day-'+d) || document.getElementById('news-day-'+d);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('.content section').forEach(s=>secObserver.observe(s));
  rail.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
}

const secObserver = new IntersectionObserver((es)=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const d = (e.target.id||'').replace(/^(sci|news)-day-/, '');
      document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));
      const n = document.querySelector(`.node[data-target="day-${d}"]`);
      if(n) n.classList.add('active');
    }
  });
},{rootMargin:'-20% 0px -70% 0px', threshold:0});

render();

document.getElementById('footer').innerHTML =
  `与「AI 前沿科技站」共用六大领域，每日联动更新 · 共 ${DATA.science_count} 条科普 / ${DATA.news_count} 篇解读（${DATA.first_date} 至 ${DATA.last_date}）<br>` +
  `科普站面向入门学习者与行业爱好者，做轻量化知识科普与大众热点解读；深度论文追踪请前往「前沿科技站」。`;
</script>
