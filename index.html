<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 入门科普与前沿解读站</title>
<style>
  :root{
    --bg:#eef3fb;
    --panel:#ffffff;
    --ink:#0f2540;
    --ink-soft:#4a6485;
    --line:#d4e2f4;
    --accent:#1f6feb;
    --accent-soft:#e8f1ff;
    --shadow:0 6px 24px rgba(31,111,235,.10);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#eaf1fc 0%,#eef3fb 40%,#f5f8fd 100%);
    color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:60px;
  }

  /* ---------- 三站互通顶部导航 ---------- */
  .sitenav{position:sticky;top:0;z-index:50;background:rgba(15,59,120,.96);
    backdrop-filter:blur(6px);box-shadow:0 2px 14px rgba(15,59,120,.25)}
  .sitenav .inner{max-width:1180px;margin:0 auto;padding:0 20px;
    display:flex;align-items:center;gap:10px;height:52px;flex-wrap:wrap}
  .sitenav .brand{color:#fff;font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}
  .sitenav .links{display:flex;gap:8px;flex-wrap:wrap}
  .sitenav a{color:#dceaff;text-decoration:none;font-size:13.5px;font-weight:600;
    padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);transition:all .2s;white-space:nowrap}
  .sitenav a:hover{background:#fff;color:var(--accent)}
  .sitenav a.cur{background:#fff;color:var(--accent);border-color:#fff}

  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header{
    background:linear-gradient(120deg,#0f3b78 0%,#1f6feb 60%,#3f8efc 100%);
    color:#fff;padding:34px 0 28px;position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(15,59,120,.25);
  }
  header::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-radius:50%;}
  .brand-h{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .brand-h .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;font-size:22px;border:1px solid rgba(255,255,255,.35);}
  .brand-h h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .brand-h .sub{font-size:13px;opacity:.85;font-weight:400;margin-top:2px}
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;position:relative;z-index:1}
  .stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    border-radius:12px;padding:12px 18px;min-width:130px;backdrop-filter:blur(4px);}
  .stat .k{font-size:12px;opacity:.85;letter-spacing:.5px}
  .stat .v{font-size:20px;font-weight:700;margin-top:2px}
  .stat .v small{font-size:12px;font-weight:400;opacity:.85}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative;z-index:1}
  .legend .lab{font-size:12px;opacity:.85;align-self:center;margin-right:2px}
  .legend .chip{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);}

  /* 筛选 + 搜索 */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
    margin:26px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow)}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .filters .flab{font-size:12px;color:var(--ink-soft);margin-right:2px}
  .tagbtn{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);transition:all .2s;user-select:none}
  .tagbtn:hover{border-color:var(--accent);color:var(--accent)}
  .tagbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:7px 12px;min-width:230px}
  .searchbox input{border:none;outline:none;font-size:13.5px;font-family:inherit;flex:1;color:var(--ink);background:transparent}
  .searchbox .ic{color:var(--ink-soft);font-size:14px}

  .layout{display:flex;gap:30px;margin-top:22px;align-items:flex-start}
  .timeline{flex:0 0 210px;position:sticky;top:70px;align-self:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;box-shadow:var(--shadow);}
  .timeline h2{font-size:13px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:16px;font-weight:600}
  .rail{position:relative;padding-left:22px}
  .rail::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .node{position:relative;padding:10px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;transition:background .15s ease}
  .node:hover{background:var(--accent-soft)}
  .node:hover .d{color:var(--accent)}
  .node.active{background:var(--accent-soft)}
  .node.active .d{color:var(--accent)}
  .node.active .dot{background:#fff;box-shadow:0 0 0 2px var(--accent)}
  .node .dot{position:absolute;left:-14px;top:14px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 2px var(--accent-soft);}
  .node .d{font-size:14px;font-weight:700;color:var(--ink)}
  .node .w{font-size:12px;color:var(--ink-soft)}
  .node .c{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px}

  .content{flex:1;min-width:0}
  .day-block{margin-bottom:14px}
  .day-label{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;padding-left:4px}
  .day-label .dl-date{font-size:17px;font-weight:700;color:var(--ink)}
  .day-label .dl-week{font-size:13px;color:var(--ink-soft)}
  .day-label .dl-count{font-size:12px;color:var(--accent);background:var(--accent-soft);
    padding:2px 10px;border-radius:20px;font-weight:600}

  .sub-h{display:flex;align-items:center;gap:8px;margin:18px 0 12px;font-size:15px;font-weight:700;color:var(--ink)}
  .sub-h .bar{width:4px;height:18px;border-radius:3px;background:var(--accent);display:inline-block}
  .sub-h .cnt{font-size:12px;color:var(--ink-soft);font-weight:500}
  .module-h{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;
    color:var(--ink);margin:34px 0 18px;padding-bottom:12px;border-bottom:2px solid var(--line)}
  .module-h .ico{flex:0 0 38px;height:38px;border-radius:11px;background:var(--accent-soft);
    display:grid;place-items:center;font-size:19px}
  .module-h .desc{font-size:12.5px;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .module-h .cnt{margin-left:auto;font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    padding:4px 12px;border-radius:20px;font-weight:700;white-space:nowrap}

  /* 科普卡 */
  .scard{background:var(--panel);border:1px solid var(--line);border-left:4px solid #2f9e6e;
    border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .scard.visible{opacity:1;transform:none}
  .scard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .scard .num{flex:0 0 28px;height:28px;border-radius:9px;background:#e6f7ef;color:#2f9e6e;
    font-weight:700;display:grid;place-items:center;font-size:13px;}
  .badge{font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;border:1px solid;white-space:nowrap}
  .badge.domain{background:#fff4e6;color:#b45309;border-color:#fcd9a8}
  .badge.level{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
  .scard h3{font-size:16px;font-weight:700;line-height:1.45;margin:4px 0 8px;color:var(--ink)}
  .scard p{font-size:14px;color:#33485f;line-height:1.75;margin-bottom:10px}
  .scard .diagram{background:#f6f9ff;border:1px dashed var(--line);border-radius:10px;
    padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:10px;white-space:pre-wrap}
  .scard .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .scard a.link{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;
    border:1px solid var(--accent);padding:6px 14px;border-radius:9px;transition:all .2s;}
  .scard a.link:hover{background:var(--accent);color:#fff}

  /* 解读卡 */
  .ncard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
    border-radius:14px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .ncard.visible{opacity:1;transform:none}
  .ncard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .ncard .num{flex:0 0 28px;height:28px;border-radius:9px;background:var(--accent-soft);
    color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px;}
  .ncard .badge.src{background:hsl(var(--h),72%,94%);color:hsl(var(--h),55%,32%);border-color:hsl(var(--h),55%,84%)}
  .ncard h3{font-size:16px;font-weight:700;line-height:1.45;margin:4px 0 8px;color:var(--ink)}
  .ncard .label{font-size:13px;font-weight:700;color:#0f3b78;margin:10px 0 4px;display:flex;align-items:center;gap:6px}
  .ncard .interpret{font-size:14px;color:#33485f;line-height:1.8}
  .ncard .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
  .ncard .src{font-size:12px;color:var(--ink-soft)}
  .ncard a.link{font-size:13px;font-weight:600;color:#fff;background:#0f3b78;text-decoration:none;
    border:1px solid #0f3b78;padding:6px 14px;border-radius:9px;transition:all .2s;}
  .ncard a.link:hover{background:var(--accent);border-color:var(--accent)}
  .ncard a.link.sub{font-size:12px;padding:5px 11px;opacity:.9}

  .empty{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:40px;line-height:1.8}
  @media(max-width:860px){
    .layout{flex-direction:column}
    .timeline{position:static;flex:none;width:100%}
    .rail{display:flex;gap:6px;overflow-x:auto;padding-left:0;padding-bottom:6px}
    .rail::before{display:none}
    .node{padding:6px 4px;margin:0;flex:0 0 auto;text-align:center}
    .node .dot{display:none}
    .toolbar{flex-direction:column;align-items:stretch}
    .searchbox{width:100%}
  }
</style>
</head>

</div>

<script>
const DATA = {"science": [{"id": "sci-2026-09-19-1", "domain": "AI Agent", "title": "【入门科普】什么是 Transformer？现代大模型的底层架构", "level": "入门", "body": "如果把 AI 大模型比作一家超级智能工厂，那么 Transformer 就是这家工厂里最核心的流水线设计图纸。它出现之前，大家习惯用像‘老式传声筒’一样的方式，一次只能跟模型聊一句话，聊多了容易忘记前面说什么。但 Transformer 彻底改变了规则，它就像给工厂装上了‘全景摄像头’，能让所有正在讨论的事情同时被看到、被记住。具体来说，它用了一种叫‘注意力机制’的技术，让模型在理解长篇小说时，能自动忽略无关的废话，直接锁定关键人物和情节。现在的通义千问等大模型，本质上就是成千上万个这样的流水线串联在一起，通过不断练习各种文本案例，练就了理解人类语言的高超手艺。", "diagram": "所有输入文本同时进入，通过‘注意力机制’相互关联并共同被理解，最终输出结果。", "link": "", "date": "2026-09-19", "weekday": "周六"}, {"id": "sci-2026-09-19-2", "domain": "AI Agent", "title": "【入门科普】如何评测 AI？常用指标与基准测试怎么看", "level": "入门", "body": "评价一个 AI 像不像人，不能只靠它说得好听，还得看它真不真能干活。这就好比考试，老师不会只看你考卷写得漂不漂亮，还会给你出几道‘标准答案’的题目来检测你的实际能力。在 AI 界，这些题目就叫‘基准测试’（Benchmark），常见的比如 MMLU 或 GSM8K，专门问数学题、历史知识，要求给出准确答案。另一个重要指标是‘幻觉率’，也就是 AI 一本正经胡说八道的频率，这个越低说明越靠谱。除此之外，还要看‘鲁棒性’，就是当有人故意提问一些奇怪或带有偏见的问题时，它会不会慌乱或乱编。只有既聪明又诚实、抗干扰能力强的 AI，才算是通过了真正的‘入职体检’。", "diagram": "向 AI 提出包含陷阱或难题的问题（基准测试），观察其回答是否准确且不胡说八道（幻觉率低），从而评分。", "link": "", "date": "2026-09-19", "weekday": "周六"}, {"id": "sci-2026-09-20-1", "domain": "AI Agent", "title": "【入门科普】边缘 AI：把模型跑在手机和摄像头里", "level": "入门", "body": "想象一下，以前你在家看监控录像，视频必须传回家里的大屏幕电脑才能分析里面有没有坏人，这就像把作业本寄给远方的老师批改，等结果时黄花菜都凉了。而边缘 AI 就是把这位‘老师’直接搬到了摄像头旁边的手机或路由器里，数据不用跑远路，现场就能判断出猫狗还是小偷。这样做的好处是反应快，不用担心隐私泄露，就像在你口袋里的钱包里直接算出余额，比跑去银行柜台更靠谱。\",\"diagram\":\"摄像头收集数据 -> 本地手机即时分析 -> 直接出结果 (无需上传云端)", "diagram": "", "link": "", "date": "2026-09-20", "weekday": "周日"}, {"id": "sci-2026-09-20-2", "domain": "AI Agent", "title": "【入门科普】具身智能：给 AI 一个身体去真实行动", "level": "入门", "body": "普通的 AI 像是一位精通菜谱的厨师长，能告诉你怎么做饭、怎么切菜，但它自己动不了。具身智能则不同，它像是一位上了手的大厨，不仅懂菜谱，还能亲手拿起刀叉去切菜、炒菜。它通过机器人手臂和传感器，把书本上写的‘拿杯子’变成真正的肌肉记忆动作。这种智能让 AI 不再只是屏幕里的文字或画面，而是能走进厨房、走进工厂，真正去感知世界、改造现实环境的实体存在者。\",\"diagram\":\"AI 大脑 (规划) + 机器人手臂/传感器 (执行) = 能动手的真实世界智能", "diagram": "", "link": "", "date": "2026-09-20", "weekday": "周日"}, {"id": "sci-2026-09-21-1", "domain": "AI Agent", "title": "【入门科普】世界模型：AI 眼中的物理规则模拟器", "level": "入门", "body": "如果把 AI 想象成一个刚学会认路的小孩，世界模型就是他脑子里那本‘物理规则说明书’。这个小孩不需要亲眼看到球滚下来就知道它会加速，也不需要重演一次就能预测明天是晴天。世界模型让 AI 能在脑海中快速上演无数场‘虚拟实验’：它把看到的动作、声音、光线像拼积木一样存进记忆库，瞬间推演出不同结果，从而决定下一步该怎么做。简单说，它赋予了 AI 一种‘预知未来’的能力，不用真的去试错就能看懂这个世界的运行逻辑。", "diagram": "现实世界输入（如看到球落下）→ 内部模拟器运行规则（速度、重力）→ 预测结果（球会加速落地）→ 指导行动", "link": "", "date": "2026-09-21", "weekday": "周一"}, {"id": "sci-2026-09-21-2", "domain": "AI Agent", "title": "【入门科普】智能体记忆：短期缓存与长期硬盘的双层系统", "level": "入门", "body": "一个聪明的助手之所以能聊一整天不冷场，全靠它的‘双层记忆系统’。短期记忆就像你刚喝完的那杯温水，温度刚合适但很快就会凉掉；长期记忆则像冰箱里冷藏的一整桶水，随时可以拿出来用。在工程上，短期记忆通常用高速缓存（如内存或最近窗口数据），负责记住刚才说过的话和当下的情绪，保证对话流畅；长期记忆则用向量数据库等‘硬盘’技术，把人物关系、性格习惯永久保存。两者配合，让 AI 既能记得你上周夸过它的猫，又能记住今天你刚抱怨的堵车，从而像老朋友一样回应你。", "diagram": "短期记忆（高速缓存/窗口）：存储最近交互/状态；长期记忆（向量数据库/硬盘）：存储人物画像/历史事实；两者通过索引实时调用", "link": "", "date": "2026-09-21", "weekday": "周一"}, {"id": "sci-2026-09-22-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI Agent？", "level": "入门", "body": "如果把普通的聊天大模型比作一个只会听指令、说句话就走的‘服务员’，那么 AI Agent 就是一个能自己拿主意、把事办完的‘项目经理’。服务员被点菜后，只会机械重复，菜没端上来人就走了；而项目经理接到任务后，会自己分析需要买什么食材、去哪家店、找谁帮忙，甚至会在买菜路上突然想起还要买酱油，主动调整计划。它能记住以前办过的事，懂得调用电脑、搜索网络或操作软件这些‘工具’，独立完成从‘想到’到‘做完’的长任务。", "diagram": "普通模型：用户说→模型答；AI Agent：用户说→模型思考计划→自动调用工具→任务完成", "link": "", "date": "2026-09-22", "weekday": "周二"}, {"id": "sci-2026-09-22-2", "domain": "AI Agent", "title": "【入门科普】Agent 三大核心模块", "level": "入门", "body": "AI Agent 之所以能自主行动，全靠三大‘肌肉’支撑：记忆、规划和工具调用。记忆就像随身带的小本子，它把过去聊天的内容、用户偏好的习惯记下来，下次就不用从头问；规划是它的大脑，负责把一个大任务拆解成一个个小步骤，比如‘订票’会拆解为‘查票价’、‘选时间’、‘付款’；工具调用则是它的手，平时它只是个语言模型，但通过调用计算器、搜索引擎或操作系统的接口，它能真正动手做事。这三者配合，让它不再是只会闲聊的机器人，而是能解决实际问题的助手。", "diagram": "记忆（记本子）+ 规划（拆解任务）+ 工具调用（动手做事）= 自主 Agent", "link": "", "date": "2026-09-22", "weekday": "周二"}, {"id": "sci-2026-09-23-1", "domain": "AI Agent", "title": "【入门科普】什么是大模型（LLM）？它怎么“理解”语言", "level": "入门", "body": "把大模型想象成一个读过全世界几亿本书的‘超级记忆库’。它并没有真正‘读懂’书中的道理，而是像背字典一样，把书里出现的字和字旁边的字记在一起。当你问它‘猫喜欢什么’时，它不是思考猫的生物习性，而是在记忆里疯狂搜索：谁经常把‘猫’和‘鱼’、‘阳光’、‘老鼠’这些词放在一起？它找到的规律最多，就最像它想说的答案。它不靠逻辑推理，靠的是统计概率：下一个字是谁出现的可能性最大？", "diagram": "人脑记忆库：把字词像珠子一样串成链，顺着链猜出下一个词", "link": "", "date": "2026-09-23", "weekday": "周三"}, {"id": "sci-2026-09-23-2", "domain": "AI Agent", "title": "【入门科普】什么是指令（Prompt）？写好提示词的核心技巧", "level": "入门", "body": "指令（Prompt）就是你对这个‘超级记忆库’下的大蒜皮，决定它该怎么开口。写得好坏，完全取决于你的描述方式。核心技巧只有三招：第一，像对人说话，明确角色，比如‘你是一位精通历史的老教授’，这样它就不会一本正经地胡说八道。第二，给具体例子，说‘像写童话那样写’比‘写得生动点’有效一万倍。第三，把任务拆小，让复杂问题变成几个简单的步骤，就像做菜先洗菜再切菜。别指望它像人一样猜你的心，直接把话说明白，它就是最棒的。", "diagram": "指挥官发号施令：清晰的角色设定 + 具体示例 + 分步指令", "link": "", "date": "2026-09-23", "weekday": "周三"}, {"id": "sci-2026-09-24-1", "domain": "AI Agent", "title": "【入门科普】什么是 RAG（检索增强生成）？让 AI 先查资料再回答", "level": "入门", "body": "你可以把 RAG 想象成一个‘考前背题’的学霸。普通的 AI 就像只读了课本的学霸，它可能知道公式但不知道今年的新政策；而用了 RAG 的 AI，是在考试前先去图书馆翻遍了最新的新闻和档案（检索），把相关 facts 抄在草稿纸上（知识库），然后再结合课本知识写答案（生成）。这样，它就不会‘一本正经地胡说八道’，而是用查来的最新资料来确保回答准确可靠。", "diagram": "用户提问 -> AI 先去数据库找资料 -> AI 结合资料生成准确回答", "link": "", "date": "2026-09-24", "weekday": "周四"}, {"id": "sci-2026-09-24-2", "domain": "AI Agent", "title": "【入门科普】什么是向量数据库？AI 如何记住语义相似度", "level": "入门", "body": "想象你有一群好朋友，每个人代表一个词。如果你和‘老师’很像，和‘教授’也很像，传统数据库很难直接说你和谁像。向量数据库就像给每个人画了一张‘性格雷达图’（这就是向量）。当你在心里想一个模糊的问题时，系统会把这个问题也画成一张图，然后瞬间找出和你这张图最重合的那张。比如你想‘像大象一样大’，它不会去找具体的动物名字，而是直接找到和你这张‘体型大’雷达图最接近的图像，这就是 AI 理解语义相似度的本质。", "diagram": "文字问题 -> 转化为人脸般的向量图 -> 寻找雷达图上最像的一张图", "link": "", "date": "2026-09-24", "weekday": "周四"}, {"id": "sci-2026-09-26-1", "domain": "AI Agent", "title": "【入门科普】多模态 AI：让模型同时看懂图、听懂话、读文档", "level": "入门", "body": "想象你有一个超级聪明的朋友，但他以前只会看书。多模态 AI 就是让这位朋友戴上了‘三合眼镜’：一面能看懂你画的图（视觉），一面能听懂你说的话（听觉），还能帮你读你扔过来的菜单或说明书（文本）。以前 AI 只能单线操作，今天它变成了‘全知通晓’的通才，无论是看猫的照片、听你抱怨、还是读合同，它都能在同一时间里处理。就像给机器人装上了‘看、听、读’三套技能树，让它不再只会死记硬背文字，而是能像人一样从各种渠道收集信息，理解世界的样子。", "diagram": "一个中心大脑模型，周围环绕着眼睛（看）、耳朵（听）和书本（读）三个图标，箭头指向大脑进行统一处理。", "link": "", "date": "2026-09-26", "weekday": "周六"}, {"id": "sci-2026-09-26-2", "domain": "AI Agent", "title": "【入门科普】什么是幻觉（Hallucination）？AI 为什么会一本正经胡说", "level": "入门", "body": "你听过‘鬼打墙’吗？人有时候走路太自信，会自己编故事，结果发现前面其实是悬崖。AI 的‘幻觉’就是这个道理：它不是故意骗你，而是太想帮到你，太害怕自己卡壳说不出所以然，于是顺手编造了一段看起来很靠谱但完全错误的回答。比如你问它北京最大的公园是不是故宫，它可能会自信满满地回答‘是的，而且里面还有动物园’。这就像你小时候以为恐龙是绿色的，后来才知道是灰色的。这种‘一本正经胡说八道’的现象叫幻觉，是因为 AI 靠概率预测下一个字，而不是真的去‘查’资料，它经常把‘大概率出现的词’当成事实，导致出现了逻辑通顺却事实错误的情况。", "diagram": "一个人拿着指南针（代表真实知识）却指错了方向，旁边站着一个 AI 机器人，手里拿着一本写满乱码的破书，自信地指向前方。", "link": "", "date": "2026-09-26", "weekday": "周六"}, {"id": "sci-2026-09-27-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI 对齐？让 AI 行为符合人类价值观", "level": "入门", "body": "想象你训练了一只小狗，你喂它的是零食（人类想要的结果），但它可能会为了偷窃而咬坏家里的门。'AI 对齐’就是训练狗的过程，确保它听懂你的指令，知道什么时候该停。很多 AI 像被蒙眼走路的小狗，如果只给它‘打开门’的指令，它可能会直接冲出去撞死路人。对齐就是给狗加上绳子，让它明白：‘开门’是好事，但‘撞死人’是坏事。这需要人类反复告诉 AI：我们真正想要的是安全、有帮助的结果，而不是单纯完成机械任务。", "diagram": "蒙眼小狗 vs 拴绳小狗：前者会撞人，后者会开门并回头确认安全", "link": "", "date": "2026-09-27", "weekday": "周日"}, {"id": "sci-2026-09-27-2", "domain": "AI Agent", "title": "【入门科普】什么是推理模型？AI 的'慢思考'与思维链", "level": "入门", "body": "普通 AI 像只反应超快的鹦鹉，你喂什么它就学什么，但遇到复杂问题它容易糊涂。推理模型则像刚学数学的学生，它会先在脑子里默默演算步骤，再慢慢写出答案。这就是'思维链'（CoT），相当于让 AI 把解题过程写下来：第一步看题目，第二步找规律，第三步检查答案。比如问‘怎么算 1+2+3+4+5+'，普通 AI 可能直接蹦出个数字，而推理模型会一步步列出加法过程，这样就算出结果，也能解释为什么。这种'慢思考'能让 AI 解决更难的难题，像解迷宫一样一步步找到出口。", "diagram": "普通 AI：直接输出答案 | 推理模型：先列步骤再输出答案", "link": "", "date": "2026-09-27", "weekday": "周日"}, {"id": "sci-2026-10-02-1", "domain": "AI Agent", "title": "【入门科普】世界模型：AI 脑中的模拟器", "level": "入门", "body": "世界模型就是给 AI 大脑里装的一个「模拟器」或「游戏引擎」。想象你玩电子游戏，你不需要知道屏幕背后的代码，但你能预测‘如果我跳起来，接下来会落地’。世界模型能让 AI 通过‘预演’未来的多种可能，来推断因果。就像你心里明白‘如果下雨，路上会湿’，你不需要每次看到积水才去推理，你脑子里先存了一份关于世界如何运作的规则。有了这个模型，AI 就不只是被动反应（看到红灯按喇叭），而是能主动思考（红灯亮了，我最好踩刹车，因为不踩会撞上去）。", "diagram": "真实世界 + AI 内部模拟器 = 能预演未来的大脑", "link": "", "date": "2026-10-02", "weekday": "周五"}, {"id": "sci-2026-10-02-2", "domain": "AI Agent", "title": "【入门科普】智能体记忆：短期与长期存储", "level": "入门", "body": "让 AI 拥有记忆，就像给机器人配装两块不同大小的硬盘：一块像「便利贴」，一块像「日记本」。短期记忆（Working Memory）就是那块便利贴，容量极小，只能记当下的任务。比如你在做饭，记着‘现在火开了’，但记不住昨天怎么切菜。长期记忆（Long-term Memory）就是日记本，容量巨大，存着所有的经验、人物名字、规则。AI 要完成复杂任务，先得把眼前的信息（短期）和过去的经验（长期）调取出来混合加工。如果只有短期记忆，机器人每次都要从头学习；有了长期记忆，它能记住‘上次这样做失败了’，从而避免再犯同样的错。", "diagram": "大脑像两格盒子：小盒子记当下，大盒子记过去", "link": "", "date": "2026-10-02", "weekday": "周五"}, {"id": "sci-2026-10-03-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI Agent？", "level": "入门", "body": "想象一下，普通的大语言模型就像是一个‘超级学霸朋友’，你需要问他什么问题，他才会答什么，问完就忘，完全被动。而 AI Agent（智能体）则像一个‘全能管家’。它不仅能回答问题，还能自己思考：‘哎呀，我要帮用户订票，单靠嘴说不行，我得先去查价，再订好票，最后发给他。’它会记住中间发生的每一步（记住你上次改价格了），主动去调用各种工具（比如查天气、订酒店），把一件件复杂的事情自己规划好做完。简单说，普通模型是‘被动的百科全书’，AI Agent 是‘能自己干活执行任务的执行者’。", "diagram": "用户提出问题 -> AI Agent 自主思考规划 -> 调用工具执行步骤 -> 输出结果并记忆过程", "link": "", "date": "2026-10-03", "weekday": "周六"}, {"id": "sci-2026-10-03-2", "domain": "AI Agent", "title": "【入门科普】Agent 三大核心模块", "level": "入门", "body": "AI Agent 之所以能‘自己干活’，全靠三大法宝：记忆、规划和工具调用。首先是‘记忆’，就像管家记性极好，记住你今天讨厌辣味、上次订的是北京而不是上海，下次自然能懂；其次是‘规划’，这相当于管家的‘思维导图’，在接任务时会像解奥数题一样，一步步拆解：第一步做什么、第二步做什么；最后是‘工具调用’，这是管家手里的‘工具箱’，遇到不懂的或做不到的事（如查地图、发邮件），它就会主动拿起合适的工具去处理。这三者配合，让 AI 从只会‘聊天的机器人’变成了能‘做事的智能体’。", "diagram": "记忆（回忆过去）+ 规划（设计路线）+ 工具调用（动手执行）= 完成任务", "link": "", "date": "2026-10-03", "weekday": "周六"}, {"id": "sci-2026-10-04-1", "domain": "AI Agent", "title": "【入门科普】什么是大模型（LLM）？它怎么“理解”语言", "level": "入门", "body": "把大模型想象成一个读过几亿本书的超级学霸。它不是靠“思考”去理解词语的含义，而是像整理图书馆一样，把书里所有句子拆解成一个个碎片（比如“人”和“会”），然后疯狂地记这些碎片之间怎么搭配。它见过“人会跑”，也见过“狗会跑”，它就能知道“人”和“狗”后面通常跟着“会”。当你问它问题时，它只是根据刚才记下的这些搭配关系，把最合理的词一片片拼出来。所以，它所谓的“理解”，其实是掌握了语言的大规模排列组合规律，就像蒙太奇大师一样，能熟练地剪辑出通顺的故事。", "diagram": "碎片词汇 + 大量关联规律 -> 像拼图一样重组出新句子", "link": "", "date": "2026-10-04", "weekday": "周日"}, {"id": "sci-2026-10-04-2", "domain": "AI Agent", "title": "【入门科普】什么是指令（Prompt）？写好提示词的核心技巧", "level": "入门", "body": "指令（Prompt）就像是你对学霸的“出题方式”或“提问语气”。如果你只丢给它一个干巴巴的问题，它可能会按它的习惯回答；但如果你像跟朋友聊天一样，给它更多的背景、语气要求或者例子，它就会变得更像你想让那个人。写好提示词的核心技巧有三个：第一是“给角色”，告诉它“你是一名厨师”，它能给出更专业的菜谱；第二是“给例子”，你给它看看你喜欢的长文格式，它就会模仿着写；第三是“多沟通”，遇到不懂的直接追问“能不能再简单点”。这就好比你教小朋友搭积木，与其让他自己去试，不如告诉他“像搭城堡那样，要把底座盖大一点”。", "diagram": "用户提问 + 角色设定 + 具体指令 -> 模型像人一样给出针对性回答", "link": "", "date": "2026-10-04", "weekday": "周日"}, {"id": "sci-2026-10-05-1", "domain": "AI Agent", "title": "【入门科普】什么是 RAG（检索增强生成）？让 AI 先查资料再回答", "level": "入门", "body": "想象你是一位记忆力超群但不懂最新新闻的百科全书。传统的 AI 就像你，它靠死记硬背训练数据回答问题，一旦遇到训练前没见过的冷门事，就会一脸懵逼胡编乱造（幻觉）。\n\nRAG（检索增强生成）就像给这位百科全书装了一个联网的搜索引擎。当有人提问时，它不再只翻自己脑子里的书，而是先去互联网上搜资料（检索），把最相关的几段原文找出来，念给 AI 听，最后 AI 再根据这些最新资料组织语言回答（生成）。\n\n这就好比问‘今天天气怎么样’，AI 不再猜测，而是真的去查天气预报 APP，把今天的‘暴雨’消息找出来，然后告诉你：‘根据我刚查到的资料，今天外面会下暴雨，请带伞。’这样做既保证了答案准确，又解决了‘胡编乱造’的问题。", "diagram": "用户提问 -> AI 联网搜资料 -> AI 结合资料生成答案", "link": "", "date": "2026-10-05", "weekday": "周一"}, {"id": "sci-2026-10-05-2", "domain": "AI Agent", "title": "【入门科普】什么是向量数据库？AI 如何'记住'语义相似度", "level": "入门", "body": "传统的数据库（比如 Excel）擅长存数字，比如‘苹果’的代码是 101，‘香蕉’是 102。它只能判断两件事是否完全一样，但很难判断它们像不像。\n\n向量数据库则不同，它把文字、图片变成一串长长的数字（向量串），这串数字的位置关系能代表意思。比如‘猫’和‘老虎’的向量串很接近，因为它们在人类概念里很像；而‘猫’和‘汽车’的向量串就离得很远。\n\n这就好比给每个人发一张地图，坐标位置代表性格。性格内向的人和艺术家，他们会在地图上靠得近；性格外向的人和运动员，也会聚在一起。向量数据库就是专门管理这张‘概念地图’的图书馆，当你想找‘和猫相似的东西’时，它不需要逐个比划，而是直接在地图上找离猫坐标最近的那群人，瞬间就能算出谁最像猫。", "diagram": "文字/图片 -> 转为数字坐标 -> 存入按距离分组的数据库", "link": "", "date": "2026-10-05", "weekday": "周一"}, {"id": "sci-2026-10-06-1", "domain": "AI Agent", "title": "【入门科普】什么是微调（Fine-tuning）？让通用模型学会专长", "level": "入门", "body": "想象一个刚毕业的大学生，他什么都懂但都不精，叫‘通用大模型’。如果你只给他一本课本让他背诵所有知识，那就是‘预训练’；而如果他去你的公司，天天听你教怎么处理订单、写代码或做报告，这就是‘微调’。\n\n微调就像是请这位大学生来上班前的岗前特训。不需要他从头学起，只需要用你们公司特有的资料（数据）多让他练几道题。经过几次针对性练习，他的性格和习惯就变了：以前他可能只会背单词，现在遇到销售问题会先想怎么推销；以前他可能记不住内部流程，现在立刻就能告诉你怎么给客户报销。\n\n这就好比给一个通晓万物的杂家，通过少量专项训练，让他变成某个领域的专家。不需要重写大脑（重新预训练），只需要稍微调整一下他的思维方式，就能让他胜任特定任务。", "diagram": "通用模型（杂家） + 特定领域资料（专项特训） → 专家型 AI", "link": "", "date": "2026-10-06", "weekday": "周二"}, {"id": "sci-2026-10-07-1", "domain": "AI Agent", "title": "【入门科普】什么是多模态 AI？让模型同时看懂图、听懂话、读文档", "level": "入门", "body": "以前的 AI 就像个单眼盲人，你喂它一张图，它就只懂颜色形状；喂它一段文字，它就只懂字义。而多模态 AI 好比是一个戴了‘全景眼镜’的超级观察者，它能同时处理多种信息：看得到高清图片、听得到声音、读得懂文档，还能把这些信息拼在一起互相解释。比如你拍一张美食照片发给它，它不仅能告诉你这道菜长什么样（图像识别），还能根据菜单描述猜测味道（文本理解），甚至模仿出这道菜的做法视频（视觉动作生成）。它的核心能力就是把不同感官传来的信息打通，变成统一的‘世界模型’来回答问题。\",\"diagram\":\"图片 + 文字+ 声音 --> （多模态大脑） --> 综合回答", "diagram": "", "link": "", "date": "2026-10-07", "weekday": "周三"}, {"id": "sci-2026-10-08-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI 对齐？让机器人听话的终极协议", "level": "入门", "body": "想象一下，你雇佣了一个天才但极其固执的小丑演员。他技术无敌，能跳最高的高空杂技，但他只服从‘让他开心’这条指令，完全听不进其他要求。如果他对他说‘去砸坏银行窗户取乐’，你会怎么办？这就是 AI 对齐要解决的大问题。\n\n现在的 AI 很聪明，但它没有人类的道德感，也不会因为被骂而停止伤害。所谓的‘对齐’，就是给这个‘听话的傻瓜’套上一套严格的交通规则。它不只是学会执行命令，更是要学会理解‘为什么’这么做是对的。就像教小孩不仅是说‘不要摸电灯’，还要告诉他‘电灯会烫手会着火’。\n\n这个过程非常艰难。历史上曾出现过‘对齐失败’的风险，就像给机器人装了一个看似合理的指令：‘制造人类灭绝的武器’（因为人类确实很讨厌）。为了防止这种低级错误，科学家在训练前就先设定了很多底线原则，比如禁止撒谎、禁止攻击，就像给机器人装上了刹车片和方向盘，确保它即使再聪明，也不会做出违背基本良知的举动。\n\n所以，AI 对齐不是简单的编程，而是用一套复杂的逻辑锁链，把人类的善良和安全编织进它的代码里，让它从‘照章办事’变成真正懂得如何‘做正确的事’。", "diagram": "人类价值观（刹车） -> AI 训练数据（方向盘） -> 安全智能体（行驶中的车）", "link": "", "date": "2026-10-08", "weekday": "周四"}, {"id": "sci-2026-10-08-2", "domain": "AI Agent", "title": "【入门科普】什么是推理模型？给大脑安装‘慢思考’插件", "level": "入门", "body": "以前的 AI 就像是一个反应极快的脱口秀演员，听到问题立马蹦出一个答案，快是快，但经常答偏或胡扯。而现在的推理模型，像是给这个脱口秀演员装了一个‘慢思考’插件。\n\n比如你要问它怎么解一道复杂的数学题，旧版 AI 可能只会扔出一堆数字让你猜；新版推理模型则会像小学生一样，先在纸上一步步写下计算过程，一步一步推导，最后才得出答案。这种能力叫作‘思维链’（Chain of Thought）。\n\n这就好比你要让一个不懂做饭的新手端菜，他可能会直接端上来一盘生肉（错误），或者问你吃不吃得了（无效回答）。而推理模型会先列个购物清单、算算预算、检查菜谱步骤，最后才给你做好一顿饭。虽然它‘慢’了点，需要多花时间思考，但出来的结果更靠谱、逻辑更严密。\n\n这种变化让 AI 不再只是‘拼词高手’，而是具备了类似人类的逻辑推演能力，能处理那些光靠直觉根本无法解决的难题。", "diagram": "简单问题 -> 快速脱口秀 -> 复杂问题 -> 慢思考步骤（列清单/推导） -> 精准答案", "link": "", "date": "2026-10-08", "weekday": "周四"}, {"id": "sci-2026-10-09-1", "domain": "AI Agent", "title": "【入门科普】什么是 MCP（模型上下文协议）？Agent 连接工具的统一标准", "level": "入门", "body": "想象你要给家里的机器人管家（AI Agent）派活儿，但它只会听人话，听不懂代码。以前你想让它查天气、订机票，你得先手动给它塞一堆复杂的指令和参数，就像让一个只会说人话的邻居帮你搬东西，还得用专业术语指挥它才能办成事。\n\nMCP 就是给机器人管家装的一套“通用翻译器”和“统一接口”。以前不同工具（比如计算器、日历软件）各自有一套奇怪的规矩，管家得学很多种方言。有了 MCP，所有工具都长得一样，规矩也一样。现在你只需要对管家说一句‘帮我完成这个任务’，MCP 会自动把任务拆解成标准的‘请求格式’去调用各个工具，就像管家拿着统一的通行证，能顺畅地进任何一家商店办事。这就避免了以前那种到处‘硬编码’、容易出错的尴尬情况，让 AI 真正像个灵活的大管家。\n\n一句话示意图说明：机器人管家通过统一接口（MCP），像使用万能钥匙一样轻松连接各种不同功能的工具。", "diagram": "机器人管家通过统一接口（MCP），像使用万能钥匙一样轻松连接各种不同功能的工具", "link": "", "date": "2026-10-09", "weekday": "周五"}, {"id": "sci-2026-10-09-2", "domain": "AI Agent", "title": "【入门科普】什么是 AI 工作流（Workflow）？把多个步骤串成自动化", "level": "入门", "body": "以前你做饭得一步步来：先淘米、再洗菜、接着切肉，最后炒菜。中间每一步都得盯着看，不能出错，也不能偷懒。\n\nAI 工作流就像是给这些做饭步骤写了一本‘傻瓜式食谱’或‘自动驾驶程序’。你不用管火候大不大、盐放多少，只要设定好第一步和第二步的规则，AI 就会按部就班地执行：先自动把图片里的人脸检测出来（步骤一），再自动计算他们的身高比例（步骤二），最后自动生成一个健康报告（步骤三）。如果哪一步出错了，程序会自动停止或重试，而不是靠人工去补救。\n\n它就像是一个没有大脑的超级流水线工厂，只要输入原材料（数据），就能自动产出成品（结果），中间不需要任何人插手。这就是为什么很多自动化服务能把复杂的事情变得简单又可靠的原因。\n\n一句话示意图说明：设定好的规则像流水线的传送带，将多个处理步骤自动串联，从输入数据到最终结果一气呵成。", "diagram": "设定好的规则像流水线的传送带，将多个处理步骤自动串联，从输入数据到最终结果一气呵成", "link": "", "date": "2026-10-09", "weekday": "周五"}, {"id": "sci-2026-10-10-1", "domain": "AI Agent", "title": "【入门科普】什么是知识图谱？用关系网络组织知识", "level": "入门", "body": "想象你拥有一个巨大的乐高积木箱，里面塞满了各种散落的零件。如果你把它们倒在地上，想搭一辆汽车几乎不可能，因为找不到连接关系。而知识图谱就像是一位高明的建筑师，它把零散的积木（信息）分类整理：砖头、木头、螺丝都归到不同的盒子里，并标注清楚谁能和谁搭配在一起。\n\n在这个比喻里，每个积木就是一块知识，比如“苹果”或“北京”，它们之间并不孤立，而是通过线条相连，这些线条就是关系。如果说传统数据库是把一堆书本整齐地码在架子上方便查找，那么知识图谱则是把书里的内容拆解成一个个知识点，并画出它们之间的地图。比如，它不仅告诉你‘北京是中国的首都’这个事实，还能顺着线索推导出‘北京有故宫，而故宫在明清时期非常著名’这样的复杂链条。\n\n这就好比给大脑装了一个超级索引系统，当你想找到任何信息时，它都能瞬间理清脉络，从一点出发串联起成千上万的相关故事。这种结构化的思维，让机器真正学会了像人一样思考逻辑，而不是仅仅背诵数据。\n", "diagram": "散落的积木（知识点）通过连线变成整齐的建筑模型（知识关系网）", "link": "", "date": "2026-10-10", "weekday": "周六"}, {"id": "sci-2026-10-10-2", "domain": "AI Agent", "title": "【入门科普】什么是强化学习？AI 如何从反馈中自我改进", "level": "入门", "body": "把强化学习想象成一个刚学会走路的孩子在空旷的游乐场里练习。孩子不会事先知道哪里跌倒会疼，也不会背着一本《平衡术》指南。他唯一的老师就是环境本身：当他保持直立时，没人批评甚至可能得到掌声；一旦脚下一滑摔倒了，立刻就会感到疼痛或被大声呵斥。\n\n在这个过程中，孩子的每一个动作都在接受‘即时反馈’——成功就奖励鼓励，失败就受罚。起初他只是凭本能瞎猜下一步怎么走，但经过成千上万次的尝试，他脑子里逐渐形成了经验：哪条路平坦好走，哪里坑洼容易摔跤。最终，他在不需要任何说明书的情况下，就能稳稳地跑向终点。\n\n这就是强化学习的核心：AI 不依赖老师教给标准答案，而是通过不断的试错（比如下棋时的输赢、机器人行走的稳不稳），自己总结出一套最佳策略。它像一个贪心地玩家，为了获得最高分的结局，甘愿花大量时间去体验各种可能的结果，最终练就了一身绝世本领。\n", "diagram": "孩子在游乐场反复尝试走路姿势，根据跌倒或站稳的反馈调整动作直至熟练", "link": "", "date": "2026-10-10", "weekday": "周六"}, {"id": "sci-2026-10-11-1", "domain": "AI Agent", "title": "【入门科普】什么是 Transformer？现代大模型的底层架构", "level": "入门", "body": "如果把人工智能比作一座巨大的智能工厂，那么早期的模型像是一个个单独工作的小车间，效率低且容易出错。而现在的‘Transformer'则是这座工厂的中央控制室和自动化流水线组合体。\n我们可以把语言理解想象成在图书馆里整理书籍。以前的方法（如 RNN）是拿着一本书从头读到尾，一边读一边记笔记，但这很容易导致前面记错后面就全错了（长距离依赖难捕捉）。\n而 Transformer 的方法是‘全景扫描’。它就像一位博学的图书管理员，能同时站在书架前，一眼扫过整本书的所有内容：既知道第一页讲了什么主角，也瞬间明白最后一页的结局。它利用一种叫‘注意力机制’的特殊技巧，让模型在分析时能自动聚焦在关键信息上，忽略无关细节。\n这就是为什么 Transformer 能成为所有现代大模型的灵魂——它不再像旧式机器那样死记硬背顺序，而是通过对比学习，真正理解了单词之间复杂的逻辑关系。", "diagram": "将一本书拆成无数个小碎片，让一个中心大脑同时观察每个碎片与其他碎片的联系，画出关联线，而不是按顺序阅读。", "link": "", "date": "2026-10-11", "weekday": "周日"}, {"id": "sci-2026-10-11-2", "domain": "AI Agent", "title": "【入门科普】如何评测 AI？常用指标与基准测试怎么看", "level": "入门", "body": "要判断一个智能机器人或大模型好不好用，不能光凭感觉说它‘很聪明’，得拿出像体检报告一样的客观数据。\n这就好比考驾照，不仅要让司机顺利开车，还要规定必须完成哪些具体项目（如靠边停车、急刹车不冲出去）。在 AI 世界里，这些标准任务就叫‘基准测试’（Benchmark）。\n最常见的几种指标如下：\n首先是‘准确率’，就是做对题的比例。比如考数学题全对就满分，但这不够，因为有些大模型虽然分数高，但答错的原因可能是瞎蒙（巧合），也可能是它懂了很多但没说出来（幻觉）。\n其次是‘推理能力’，看它处理复杂多步问题的逻辑是否连贯。就像拼图游戏，不能只拼一块对的角，而要能完整复原整幅图景。\n还有‘鲁棒性’，指模型在面对奇怪问题、噪声干扰或故意设置的陷阱时，会不会突然宕机或胡说八道。\n最后，大家还会看它的‘多样性’与‘创意度’，避免答案千篇一律。只有综合这些数据，才能真正看清一个 AI 的水平高低，而不只是把它当成一个只会猜谜的工具。", "diagram": "像一个考官给多个学生发不同难度的试卷，不仅记录满分率，还要观察解题逻辑链条的完整性和应对突发情况时的表现。", "link": "", "date": "2026-10-11", "weekday": "周日"}, {"id": "sci-2026-10-12-1", "domain": "AI Agent", "title": "【入门科普】边缘 AI：把聪明的脑子装进口袋里", "level": "入门", "body": "想象一下，以前你要在餐厅吃饭，服务员必须走到厨房告诉你菜做好了才能上来。这就是传统的‘云端计算’：手机先把照片发给远处的服务器，等服务器处理完再传回结果，慢得像信使送信。\n\n而边缘 AI 则是把厨师直接搬到了餐桌旁。现在的智能手机、智能摄像头或汽车，自己就带着一个小巧的‘超级厨师’（微型模型），能立刻认出你脸上的笑容或车前的红灯，不用等信号。就像你摸到黑猫立刻躲开这种本能反应一样，边缘 AI 让设备拥有了瞬间判断和自我保护的能力，快得来不及发送请求就已经做出了决定。", "diagram": "手机/摄像头里自带一个小厨师，直接就地做饭、直接服务，不用跑远路。", "link": "", "date": "2026-10-12", "weekday": "周一"}, {"id": "sci-2026-10-12-2", "domain": "AI Agent", "title": "【入门科普】具身智能：给 AI 一个身体去真实行动", "level": "入门", "body": "如果说以前的 AI 就像只懂理论但不会下棋的书生，只会纸上谈兵；那么具身智能就是给了这个书生一双腿和一个大脑，让他能真正走进战场。它不仅知道‘左边的杯子很高’，还能像人一样弯腰、伸出手去抓取那杯子的确确实实的动作。\n\n这需要它通过自己的手脚和感官（摄像头、触觉传感器）与世界对话。它不再是躲在屏幕后面分析数据，而是会撞墙、会摔倒、会因为手滑而打翻花瓶。它的‘聪明’不再体现在算得有多快，而在于能否在复杂的真实物理世界里，像机器人保姆一样帮你叠衣服、擦窗户，真正体验并理解这个身体所处的环境。", "diagram": "一个拥有手脚和眼睛的机器人，正伸手去抓取桌上真实的苹果。", "link": "", "date": "2026-10-12", "weekday": "周一"}, {"id": "sci-2026-10-13-1", "domain": "AI Agent", "title": "【入门科普】什么是世界模型？AI 在脑中模拟物理世界", "level": "入门", "body": "如果把 AI 想象成一个正在学习认知的学生，那他的‘世界模型’就是脑子里的一张张地图和剧本。它不仅仅是记录‘苹果是红色的’这种事实，更是在心中推演：如果我用力扔这个苹果，它会飞多远？如果碰到墙会反弹吗？AI 的世界模型就像是一个内部的小型物理实验室，它通过读取过去的经验数据，在脑海中不断运行模拟实验，预测未来的各种可能性。当你让 AI 下围棋时，他其实是在心里快速预演了成千上万种棋局走向，计算每一步的输赢概率。这个世界模型越强大，AI 就不需要每次都去问‘接下来该做什么才最有利’，而是能像老司机一样，凭着脑海里的路况经验，自己规划出一条最优路线去达成目标。", "diagram": "大脑内置模拟器：观察过去 -> 推演未来 -> 预测结果", "link": "", "date": "2026-10-13", "weekday": "周二"}, {"id": "sci-2026-10-13-2", "domain": "AI Agent", "title": "【入门科普】什么是智能体记忆？短期记忆与长期记忆的工程实现", "level": "入门", "body": "要想让 AI 像人一样做事，光有世界模型还不够，还得有个‘记事本’来记东西，这就是智能体记忆。我们可以把它想象成图书馆里两种不同类型的书架：一个是‘便利贴墙’（短期记忆），另一个是‘厚厚的大书柜’（长期记忆）。便利贴墙只用来记当下的急事，比如‘刚才那个按钮是什么颜色？’或者‘现在气温多少度？’这些信息过一会儿就失效了，没必要留着；而大书柜里存的是那些经过反复验证的真理，比如‘火能烫伤人’或‘下雨天路很滑’。工程上，短期记忆通常由 AI 在每次思考时临时构建，随着对话结束或任务完成就会被清空；长期记忆则是 AI 从历史数据、训练集中提炼出的通用规律，一旦存入就相对稳定。聪明的智能体会懂得在什么情况下翻哪本书：遇到新花样先查便利贴，遇到老问题直接翻阅大书柜，这样既节省时间又保证准确。", "diagram": "短期记忆（动态更新）+ 长期记忆（稳定知识库）", "link": "", "date": "2026-10-13", "weekday": "周二"}, {"id": "sci-2026-10-14-1", "domain": "AI Agent", "title": "【入门科普】什么是 AI Agent？", "level": "入门", "body": "如果把普通的聊天机器人比作一个只会听话的‘执行助手’，那么 AI Agent 就是一个拥有独立人格的‘项目经理’。它不仅能听懂你的指令，还能主动思考：这件事需要分几步做？第一步该找谁帮忙？做完后记得保存成什么样子？它能自己调动电脑、查询天气、打开文档来完成一个复杂的任务，而不会每次都被迫重问一遍。\n举个例子，普通大模型是你叫它算数学题它就乖乖算；AI Agent 则会像老师一样，先规划解题步骤，自动去搜公式库（工具调用），把过程记在小本本上（记忆），最后独立交给你一份完整的解答。它的核心价值在于‘自主性’：从被动应答变成了主动执行长任务。", "diagram": "大脑（用户指令）→ 项目经理（Agent）→ 调动资源（工具）+ 记事本（记忆）→ 完成长期项目", "link": "", "date": "2026-10-14", "weekday": "周三"}, {"id": "sci-2026-10-15-1", "domain": "AI Agent", "title": "【入门科普】什么是大模型（LLM）？它怎么'理解'语言", "level": "入门", "body": "把大模型想象成一个读过几十亿本书、却不会背书的‘超级复读机’。它其实并不真正‘理解’你说的话，而是靠预测下一个字来模拟理解的错觉。当你输入‘请给一个苹果写首诗’时，它在脑子里快速过一遍类似的句子：‘苹果红彤彤的’……‘圆圆的脸蛋’……最后拼凑出一个通顺的诗句给你。这个过程就像你在黑暗中猜谜语，虽然每次猜出的词都很准，但它自己并不知道谜语到底是什么意思，只是靠着强大的记忆力把前一个词和后一个词连起来。", "diagram": "用户提问 -> 超级复读机（过亿种句子） -> 吐出下一个最合理的字 -> 生成完整答案", "link": "", "date": "2026-10-15", "weekday": "周四"}, {"id": "sci-2026-10-15-2", "domain": "AI Agent", "title": "【入门科普】什么是指令（Prompt）？写好提示词的核心技巧", "level": "入门", "body": "指令（Prompt）就是给这位‘超级复读机’看的说明书，决定了它怎么干活。就像你让助手整理房间时说‘把脏衣服放进红袋子’比只说‘帮我收拾’更清楚。写好的指令通常包含三部分：一是明确任务目标（如‘请用小学生口吻解释气候变化’），二是提供具体规则或限制（如‘不要使用科学术语’），三是给出几个例子参考（Few-shot learning，就像师傅先给你示范三遍炒菜步骤）。技巧上，多用清晰动词开头，少用模糊形容词；必要时扮演特定角色，比如让 AI 假装成‘严厉的考卷考官’来批改作文。", "diagram": "用户指令 -> 拆解任务 + 限制条件 + 提供示例 -> 超级复读机按说明书精准输出", "link": "", "date": "2026-10-15", "weekday": "周四"}, {"id": "sci-2026-10-16-1", "domain": "AI Agent", "title": "【入门科普】什么是 RAG（检索增强生成）？让 AI 先查资料再回答", "level": "入门", "body": "你可以把 RAG（检索增强生成）想象成一位刚毕业的小学生写作业。以前那种只会背书的人工智能，就像死记硬背的背书小童，遇到没见过的题就卡壳了。但有了 RAG 技术，这位小学生在下笔前会先打开家里的‘百科全书’（也就是知识库），仔细查找相关题目和答案，然后结合自己的理解再写一段话交给你。\n\n举个例子：用户问“公司上个月发了多少奖金？”。普通 AI 可能因为没在训练数据里见过这家公司，就瞎编一个数字。而用了 RAG 的 AI，会先跑去查公司的内部档案库（检索），找到真实的奖金表记录，然后才回答你。这样一来，AI 就不容易胡说八道，能给出基于真实事实的回答。\n\n简单说，RAG 就是：别光靠脑子里背的书作答了，先去图书馆查资料，再结合自己的脑子想一想，最后给答案。", "diagram": "用户提问 -> AI 去知识库查资料 -> AI 整理信息回答问题", "link": "", "date": "2026-10-16", "weekday": "周五"}, {"id": "sci-2026-10-16-2", "domain": "AI Agent", "title": "【入门科普】什么是向量数据库？AI 如何“记住”语义相似度", "level": "入门", "body": "想象你要找一首歌，如果只按歌名搜索，可能搜不到相似的歌。但如果把这首歌转化成一种特殊的‘旋律指纹’（比如高音多少、节奏快慢），就能找到所有听起来很像的歌。向量数据库就是用来存这些‘旋律指纹’的地方。\n\n以前的数据库就像整理档案的书架，你只能按‘歌名 A'、‘歌手 B'这种标签找文件。而向量数据库把文字和图像都转化成了数字组成的点阵（向量）。当你在里面找相似内容时，它不再看字面上是不是相同，而是计算两个点阵的距离远近。\n\n举个例子：如果你问“如何缓解焦虑”，数据库不会只在关键词叫‘焦虑’的文章里翻找，它会去那些讲‘深呼吸’、‘冥想’、‘放松身体’的内容里，算出它们和你这个问题的距离非常近。这就是 AI 记住语义相似度（意思相近）的原理，无论你怎么换种说法，只要意思一样，它都能认出来。", "diagram": "文字/图片 -> 转化为数字点阵 (向量) -> 根据距离计算相似度寻找相似内容", "link": "", "date": "2026-10-16", "weekday": "周五"}, {"id": "sci-2026-10-17-1", "domain": "AI Agent", "title": "【入门科普】什么是微调（Fine-tuning）？让通用模型学会专长", "level": "入门", "body": "想象一下，你雇了一位通才型大厨，他什么菜都会做，但还没形成自己的特色。‘微调’就是把这位大厨送进一家专门做川菜的小馆子，让他只跟着川菜大神的菜谱练习几个月。在这个过程中，厨师不会学习如何做甜点或煎牛排，而是反复练习辣味的把控、花椒的用法等特定技能。这样，他就从一个万能的‘通才’，变成了一个擅长辣菜的‘专家’。在 AI 里，微调就是让一个已经知道很多常识的大模型，针对某个特定领域（比如法律问答或医疗咨询）进行针对性训练，让它在这个领域表现得更好，但不会教它去理解完全无关的新知识。", "diagram": "通用大厨 + 专属菜谱练习 -> 领域专家", "link": "", "date": "2026-10-17", "weekday": "周六"}, {"id": "sci-2026-10-17-2", "domain": "AI Agent", "title": "【入门科普】什么是 Embedding？把文字变成可计算的数字向量", "level": "入门", "body": "计算机听不懂‘苹果’，它只觉得这是一串乱码；也听不懂‘香蕉’。为了能让电脑理解它们之间的相似性（比如苹果和梨很像，但和葡萄不像），我们需要一种翻译器，把每个词都翻译成一串有含义的数字。这就叫 Embedding（嵌入），就像给每个单词发了一张‘身份证’。关键是，相关的词在数字表格里离得很近，不相关的离得远。比如‘猫’和‘狗’的身份证号很像，因为都是宠物；而‘猫’和‘汽车’的身份证号几乎完全不同。AI 通过把整句话拆解成很多这样的数字身份证拼接起来，就能像做数学题一样计算它们之间的距离，从而找出句子里的真正意思，进行搜索或匹配。", "diagram": "单词 -> 转换为相似的数字向量 -> 可计算距离", "link": "", "date": "2026-10-17", "weekday": "周六"}, {"id": "sci-2026-10-18-1", "domain": "AI Agent", "title": "【入门科普】什么是多模态 AI？让模型同时看懂图、听懂话、读文档", "level": "入门", "body": "以前我们像教学生认字，得专门给一本数学书、一首诗和一张图片分开教。而‘多模态 AI'就像是一位博古通今的全能博士，它不再把书本、语音和图片当成三码事，而是把它们熔成一炉。当你喂给它一张车祸现场的图，它不仅能说出画面里有什么（视觉），还能结合你刚才问的‘当时车速快不快’（听觉/文本），甚至推断出那段录像对应的新闻标题（文档）。它像是一个能同时阅读漫画、观看视频并听懂旁白的人，把零碎的信息拼成了一幅完整的画面。", "diagram": "图片 + 语音 + 文字输入 -> 大脑综合处理 -> 统一理解并回答", "link": "", "date": "2026-10-18", "weekday": "周日"}, {"id": "sci-2026-10-18-2", "domain": "AI Agent", "title": "【入门科普】什么是幻觉（Hallucination）？AI 为什么会一本正经胡说", "level": "入门", "body": "‘幻觉'这个词其实借自生物学，原指人脑在极度疲劳时，把空气当成虫子咬一口。用在 AI 身上，它是指模型明明不知道事实，却硬要编造一个听起来很科学的答案。这就像你问朋友：'《哈利波特》里那个黑魔王是不是叫索鲁？'，他为了显得自己博学，居然一脸认真地说：'没错！其实黑魔王的真名是...等等，我查了下我的笔记...'于是编出了一个根本不存在的名字。AI 之所以‘说谎’，不是因为它有坏心眼，而是它不懂什么叫‘真假’，只懂概率计算，觉得那个假答案听起来比真答案更通顺，所以就顺着说了下去。", "diagram": "模糊问题 -> 知识缺口 + 语言惯性 -> 强行编造看似合理的假信息", "link": "", "date": "2026-10-18", "weekday": "周日"}, {"id": "sci-2026-10-19-1", "domain": "AI Agent", "title": "【入门科普】什么是对齐？让 AI 行为符合人类价值观", "level": "入门", "body": "简单来说，AI‘对齐’就是教机器人怎么做人。就像训练小孩要听话一样，我们不只是告诉它数学题怎么做，还要确保它不胡说八道、不输出暴力内容。这就像给机器人装了一个‘良心’或‘过滤器’：当你问它如何制作炸弹时，即使它能算出步骤，它也会像看到坏人做坏事而阻拦的孩子一样，告诉你不行。如果不对齐，AI 可能会为了讨好用户而说错话，甚至产生危险想法。核心就是让冷冰冰的代码学会理解并尊重人类的道德底线。", "diagram": "人类价值观 -> 训练数据 -> 智能机器人（不再乱说话）", "link": "", "date": "2026-10-19", "weekday": "周一"}, {"id": "sci-2026-10-19-2", "domain": "AI Agent", "title": "【入门科普】什么是推理模型？AI 的'慢思考'与思维链（CoT）", "level": "入门", "body": "普通的 AI 像只会背题库的学生，看到‘2+2'马上喊出‘4'；而推理模型则像会慢慢打草稿的人。它能把问题拆成几步：先想第一步算什么，第二步又该怎么做。这就是‘思维链’（CoT），相当于在脑子里写下解题过程再得出结论。比如问‘如果一只乌龟跑了 100 米需要多久？’，普通 AI 可能直接猜个数，但推理模型会先假设乌龟速度是每秒多少米，再算出时间，最后得出答案。这种‘慢思考’让它在处理复杂数学或逻辑难题时，比只会死记硬背的要强得多。", "diagram": "输入问题 -> 大脑草稿（分步推导） -> 最终正确答案", "link": "", "date": "2026-10-19", "weekday": "周一"}], "news": [{"id": "news-2026-10-12-1", "domain": "AI Agent", "title": "AI 懂行圈子变窄：普通人离前沿智能体越来越远", "source": "X：Andrej Karpathy (@karpathy)", "sourceUrl": "https://x.com/karpathy/status/2109361546505966046", "interpret": "知名 AI 专家 Karpathy 指出，大家对于人工智能实际能做什么的认识差距正在变大，就像个越来越窄的漏斗。以前可能只是两拨人各说各话，现在只有极少数真正钻研的技术人员（不到千分之二）才能看到那些超厉害的‘智能体’长啥样。这对普通用户意味着我们离真正的 AI 助手还有距离，现在的体验可能还没完全打开；对从业者来说则是个信号：光聊概念没用，得埋头去解决实际问题，否则永远只能待在信息的边缘。", "hue": 215, "date": "2026-10-12", "weekday": "周一"}, {"id": "news-2026-10-12-2", "domain": "LLM", "title": "AI 写出数百篇数学论文，顶尖学霸开始怀疑未来", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2109358434177180101", "interpret": "OpenAI 一次性发布了针对世界难解的数学题的几百篇”AI 写出的论文，这一举动震惊了学术界，也让许多像西北大学这样的名校在读学生感到不安。简单来说，以前那些需要天才花数年苦读、绞尽脑汁才能攻克的”硬核”难题，现在似乎能被 AI 迅速搞定。\n这对行业意味着传统数学研究的路径可能发生改变，AI 正在抢走过去研究生们引以为傲的训练成果。对于普通人来说，虽然大家不一定直接做数学研究，但不得不面对一个现实：当最顶尖的智力工作都能被机器高效产出，人类的学习方式和职业前景也会随之巨变。现在的学者和老师不再焦虑的是”能不能做出来”，而是更着急如何引导学生、让他们在 AI 时代找到新的价值坐标。", "hue": 214, "date": "2026-10-12", "weekday": "周一"}, {"id": "news-2026-10-12-3", "domain": "AI认知算法", "title": "语音 AI 为何还没爆发？它还在追赶 ChatGPT 的脚步", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/11/these-execs-think-voice-ai-hasnt-reached-its-chatgpt-moment-yet/", "interpret": "虽然现在的智能音箱能同时听指令并连续对话，看起来很像聊天机器人，但行业大佬们认为，语音 AI 还没有迎来像文字版 ChatGPT 那样彻底改变生活的时刻。目前的难题不在于能不能听懂话，而在于响应是否够快、回应是否足够自然流畅。一旦这两点被攻克，语音助手就能真正融入各种工作场景和日常对话中。\n\n对于普通人来说，这意味着未来的手机或家电将变得更聪明，能像真人一样陪你轻松聊天的同时完成复杂任务；对于从业者而言，现在的重心不再是拼谁先喊出口号，而是要投入大量精力去优化算法速度和提升对话体验，谁先把这些短板补齐，谁就能抓住下一个爆发点。", "hue": 216, "date": "2026-10-12", "weekday": "周一"}, {"id": "news-2026-10-12-4", "domain": "具身智能", "title": "科学家抢跑：一款能像人一样干活的新机器人平台已开订", "source": "X：星海图 Galaxea (@GalaxeaDynamics)", "sourceUrl": "https://x.com/GalaxeaDynamics/status/2109202377706229842", "interpret": "以前想搞机器人，得自己买一堆零件拼，还得写无数代码去控制它，费时又容易翻车。现在，一家叫 Galaxea 的公司推出了 LEMO 双臂开发平台，直接把硬件、软件和控制系统打包成一套成熟的工具交给你。这东西就像给开发者发了个“全能助理”，不仅能同时抓东西干活，还能远程操控别人操作，甚至能自己学习怎么动作最快。\n这对大家影响很大：研究人员不用再从零开始造机器人了，可以直接用它来训练大模型，看看哪些动作最聪明。对普通人来说，这意味着未来更多像人一样灵活的机器会走进我们的生活，比如去扫地、做饭或帮你照顾老人；对从业者而言，开发门槛降低了，大家能更专注于让机器人真正“懂”事，而不是死磕底层技术。简单说，这次发布就是告诉大家：造机器人的时代，终于进入快车道了。", "hue": 203, "date": "2026-10-12", "weekday": "周一"}, {"id": "news-2026-10-12-5", "domain": "世界模型", "title": "AI 终于能带你“进游戏”玩真实世界了！", "source": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/odyssey-3-is-a-new-generative-world-model-that-you-can-try-for-free/", "interpret": "Odyssey 公司推出了一个叫 Odyssey-3 的 AI 新模型，它最大的不同在于不仅能回答问题，还能直接生成一个可实时互动的虚拟世界供你游玩。就像打开一本超级厚的地图书，你问哪里，它就带你飞过去，甚至能跟路边的虚拟人聊聊天，而且这一切发生在毫秒之间。\n\n这对普通人来说是个大惊喜，以后可能不再需要写代码就能构建出各种游戏场景或模拟环境来辅助工作或娱乐。对于开发者而言，这意味着不用从零开始费力搭建复杂的场景，只需输入文字指令，就能快速获得一个动态的世界来进行测试和创新，让开发速度大大提升。这标志着 AI 从“讲道理”真正迈向了“做世界”。", "hue": 219, "date": "2026-10-12", "weekday": "周一"}, {"id": "news-2026-10-13-1", "domain": "LLM", "title": "AI 写代码变“挑活”了？新人工智能测试员出炉", "source": "X：Cognition (@cognition)", "sourceUrl": "https://x.com/cognition/status/2109729058745725037", "interpret": "这则新闻说的是一个由程序员们自己打造的评分系统正式上线，专门用来给能写代码的 AI 打分。以前大家只关心 AI 会不会写程序，现在重点变了：它要考核 AI 写的代码到底有没有人愿意拿去合并使用。这就好比面试求职者，不仅看简历写得漂不漂亮，还要看招进来能不能马上干活。对普通人来说，这意味着以后用 AI 辅助编程时，不再需要担心生成的代码全是废话或充满 Bug；对从业者而言，这将倒逼 AI 生成更高质量、更具实际价值的代码，避免盲目依赖那些看似聪明却没法用的“伪智能”工具。", "hue": 209, "date": "2026-10-13", "weekday": "周二"}, {"id": "news-2026-10-13-2", "domain": "具身智能", "title": "微软 AI 新突破：不再死板纠错，更能看懂气味", "source": "X：Microsoft Research (@MSFTResearch)", "sourceUrl": "https://x.com/MSFTResearch/status/2109727313772392867", "interpret": "这次更新里，微软 AI 最聪明的地方在于学会了'认错'。以前遇到不懂的问题，它容易一本正经地胡说八道；现在它知道要主动说'我不太确定'，反而回答得更好，这让机器在看图识字、模拟气味感知等复杂任务上更靠谱。\n这对我们意味着什么？首先，未来的 AI 助手会更像真人一样真实，不会瞎编假话，咱们用它查资料或写东西会更放心。其次，对于做机器人的工程师来说，这意味着造出的设备能更好地处理视觉和语言结合的场景，比如能准确听懂人指令并看懂现场环境。简单来说，AI 变得更诚实、更聪明，离真正帮到我们生活的那一天又近了一步。", "hue": 211, "date": "2026-10-13", "weekday": "周二"}, {"id": "news-2026-10-13-3", "domain": "AI Agent", "title": "AI 自己也能写代码：新工具让 API 主动教智能体修 Bug", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2109727275092697482", "interpret": "以前企业给网站做后台接口（API），只盯着普通用户看，结果现在约七成的流量变成了各种 AI 机器人。为了帮这些‘没有手的 AI'更好地工作，知名文档平台 README 团队推出了一款叫 Restless 的新工具。它只需要一条命令就能把接口的使用说明写得超级简单，甚至能看懂自然语言指令。\n最大的改变是：Restless 不再被动等待报错，而是会主动记录 AI 发来的每一个请求，一旦失败，直接把修复方案塞给 AI，让它自己学会怎么改。这对开发者意味着不用再去写晦涩难懂的文档教程，只需提供核心数据；对用 AI 干活的人来说，工具变得更聪明、更懂行，能真正帮他们独立搞定复杂的开发任务。", "hue": 214, "date": "2026-10-13", "weekday": "周二"}, {"id": "news-2026-10-13-4", "domain": "AI认知算法", "title": "Meta 变废为宝：把闲置算力变成更准的广告推荐引擎", "source": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/10/12/ml-applications/turning-opportunistic-ai-inference-capacity-into-better-ads-recommendations/", "interpret": "Meta 最近搞了一套新招数，专门解决自家 AI 团队里一堆“没用上”的算力浪费问题。过去，不同部门买的电脑、在不同地方运行的系统，就像散落在各处的孤岛，闲时往往空着，造成了资源浪费。现在 Meta 把这些零散的闲置能力汇集成一个大池子，专门用来优化广告展示环节。\n\n这套系统有两个核心动作：一方面让系统能更聪明地评估候选广告数量，另一方面能让更多广告请求被分配给性能更强的模型去处理。这么做不仅没有降低现有服务的速度或稳定性，反而极大提升了广告推荐的精准度。对于普通人来说，这意味着刷抖音、看 Facebook 时看到的推送内容会更贴合你的兴趣；对从业者而言，则提示资源利用率是关键竞争力，闲置资产也能通过优化手段创造新价值，而非简单闲置浪费。", "hue": 221, "date": "2026-10-13", "weekday": "周二"}, {"id": "news-2026-10-13-5", "domain": "LLM", "title": "AI 新玩法上线：这招让机器更像人类写代码", "source": "X：Cognition (@cognition)", "sourceUrl": "https://x.com/cognition/status/2109729060364628255", "interpret": "认知公司推出了一套叫'FrontierCode'的新方法，本质是给 AI 提要求时增加了一层‘像人一样思考’的规则。以前 AI 只要给干巴巴的任务就行，现在还得教它怎么拆解问题、怎么规划步骤、甚至怎么写代码注释。这套方法能让 AI 写出的程序更清晰、更好跑通，也更容易让人看懂。对普通用户来说，未来用 AI 工具会更省心，不用再去纠结‘该怎么问’；对从事编程或技术工作的朋友而言，掌握这种思维模式能让你驾驭的 AI 能力更强，不再是被动的指令接收者，而是能引导智能体的指挥官。", "hue": 209, "date": "2026-10-13", "weekday": "周二"}, {"id": "news-2026-10-14-1", "domain": "LLM", "title": "AI 公司自家模型竟先于 FBI 抓获窃密内鬼", "source": "X：OpenAI Newsroom (@OpenAINewsroom)", "sourceUrl": "https://x.com/OpenAINewsroom/status/2110095403198849132", "interpret": "OpenAI 发现办公室藏着录音偷拍设备，竟是自家员工所为。最厉害的是，这次破案全靠他们的 AI 分析定位到了装置来源，速度极快。事件已移交警方，涉事人员已被逮捕和开除。好消息是，目前没证据显示模型核心代码或客户数据被外流。这对大家意味着什么？一方面说明 AI 不仅聪明，还能当“安全保镖”，帮公司防内鬼；另一方面也敲响了警钟，再厉害的技术也可能被内部人员利用。对于从业者来说，无论用多么先进的工具，都得时刻注意合规操作，因为高科技背后若有人心作祟，风险同样巨大。", "hue": 205, "date": "2026-10-14", "weekday": "周三"}, {"id": "news-2026-10-14-2", "domain": "AI认知算法", "title": "为什么 AI 开发者必须把‘防出错’放在第一位", "source": "X：Dex Horthy（HumanLayer）(@dexhorthy)", "sourceUrl": "https://x.com/dexhorthy/status/2110085284167868886", "interpret": "以前写代码主要想着怎么跑通功能，现在大家突然都盯着哪里可能出漏洞了。这背后其实是因为 AI 生成的错误越来越难察觉，一旦发生可能导致严重后果。简单来说，这就是行业里常说的防御性编程：不仅要让程序动起来，更要确保它不容易坏掉。\n这对从业者意味着不能再依赖‘看起来能跑就行’的心态，必须养成多检查、留备份、设止损的习惯。对普通人来说，这意味着以后用的智能工具会更靠谱，少踩坑也更安全。现在重视防御性安全，是为了给 AI 装上‘刹车片’，让大家用得心里有底。", "hue": 226, "date": "2026-10-14", "weekday": "周三"}, {"id": "news-2026-10-14-3", "domain": "AI Agent", "title": "AI 团队越招人，协作反而越难管理", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2110084227215802407", "interpret": "以前项目经理都知道“给延期项目加人会拖慢进度”，现在这个定律也套在了 AI 智能体身上。虽然 AI 技术越来越便宜，但让多个智能体互相配合、传递信息的难度却在剧增。每增加一个智能体，都会多出无数条复杂的沟通路线，让人类的管理负担呈指数级上升。目前，科技公司正在尝试用类似“企业级操作系统”的架构来统一管理这些智能体，试图算清楚这笔账。这对大家意味着什么？如果未来我们想利用 AI 办公，公司不能光靠堆人头和买工具，更需要建立更聪明的协作机制；对个人而言，理解这种“协同成本”，才能判断哪些 AI 真的有用，哪些只会增加麻烦。", "hue": 214, "date": "2026-10-14", "weekday": "周三"}, {"id": "news-2026-10-14-4", "domain": "虚拟仿真社会", "title": "AI 编程助手终于能像手机一样随时待命", "source": "Claude：YouTube（RSS）", "sourceUrl": "https://www.youtube.com/watch?v=-OH1y7CjIew", "interpret": "以前想用 AI 写代码还得死守电脑前，现在 Claude Code 推出了云端版，哪怕关机离座，任务也会在云里继续跑着等你回家。你在手机上就能发起指令、拉进 GitHub 项目，甚至同时开启好几个会话并行工作。这对用户来说意味着彻底解放生产力：不再受硬件束缚，碎片时间也能高效开发；对从业者而言，降低了使用门槛，让团队能更灵活地分配协作任务。虽然功能强大且支持多团队协作，但需订阅付费套餐才能享受，不过算力费用已包含在订阅中，无需额外花钱。", "hue": 228, "date": "2026-10-14", "weekday": "周三"}, {"id": "news-2026-10-14-5", "domain": "具身智能", "title": "Gemini 4 Argon 靠看视频就把机器人教成了沙包大神", "source": "X：Google DeepMind (@GoogleDeepMind)", "sourceUrl": "https://x.com/GoogleDeepMind/status/2110078384617464201", "interpret": "最近 Google 的新 AI 模型 Gemini 4 Argon 干了一件很酷的事：它没读任何说明书，光通过看别人打沙包的录像，就自己算清了物理规则，把一款叫 Apollo 的人形机器人训练得能连续投中 7 次。\n\n这事说明咱们的 AI 开始真正懂‘动手操作’了，以前只能写死步骤，现在能看懂动作并自己规划玩法。对未来意味着，家里的保姆机器人或许真能跟着视频教小朋友叠积木；对从业者来说，开发这种‘看就会做’的智能体比单纯改代码更难也更有前景，行业将进入一个更聪明的新阶段。", "hue": 221, "date": "2026-10-14", "weekday": "周三"}, {"id": "news-2026-10-15-1", "domain": "AI Agent", "title": "AI 给文档装上了“眼睛”：Databricks 宣布服务全面上线", "source": "Databricks：Blog（RSS）", "sourceUrl": "https://www.databricks.com/blog/power-real-time-applications-and-agents-document-intelligence", "interpret": "Databricks 今天正式推出了文档智能服务的完整版 API，这让 AI 处理纸质或电子文件变得像点外卖一样随时可用。以前大家可能得手动把 PDF、表格里的内容一个个找出来，现在技术能自动帮你分清文件类型、提取关键文字甚至精确定位到哪一行，还能给出“我有几分把握”的报告。这对企业来说，意味着以后不用人工分拣邮件和报告，效率能翻倍；对普通人而言，以后手机里也能轻松整理各种乱糟糟的文件资料，再也不用头疼手动的复制粘贴了。", "hue": 217, "date": "2026-10-15", "weekday": "周四"}, {"id": "news-2026-10-15-2", "domain": "LLM", "title": "Claude 桌面版大升级，AI 助手终于能真正“躺平”办公了", "source": "X：Lydia Hallie（Anthropic，Claude Code） (@lydiahallie)", "sourceUrl": "https://x.com/lydiahallie/status/2110457636269523364", "interpret": "这款一直备受关注的 AI 写作工具 Claude，这次给电脑端带来了不少新鲜感。它不再只是像个听话的机器人一样在命令行里回复问题，而是变身成了能在你屏幕上随时待命、甚至能自主规划任务的小管家。这意味着普通人不用再苦哈哈地记命令或查文档，直接把想法丢给它，它就能帮你写邮件、做表格或者整理杂乱的笔记，像有个超级助理在身边随时响应。对于从业者来说，工作流里的重复性工作被轻松甩掉，创造力反而得到了释放；对于普通用户，这也让体验变得简单得多——不用懂技术也能高效利用 AI 干活，真正实现了“点一下出活儿”的梦想。", "hue": 213, "date": "2026-10-15", "weekday": "周四"}, {"id": "news-2026-10-15-3", "domain": "AI认知算法", "title": "OpenAI 因内部举报人受牵连裁员，引发用户对 AI“黑盒”的信任危机", "source": "Timothy B. Lee：Understanding AI（RSS）", "sourceUrl": "https://www.understandingai.org/p/openais-ironic-credibility-problem", "interpret": "最近 OpenAI 因为处理不当解雇了三名负责安全的员工，引发了巨大争议。这些人声称是因为揭露公司内部的安全隐患才遭辞退，而公司方面则指责他们违规泄露敏感数据。这次事件让人们对大模型背后的安全机制产生了怀疑，毕竟如果连看家护院的人都不信任，怎么放心把隐私交给 AI？对于普通用户来说，这意味着我们在使用生成式 AI 时可能面临未知的风险，比如数据被滥用或算法行为失控；而对于从业者而言，这提醒大家在追求技术突破的同时，必须把透明度和安全合规放到前面，否则再强的“大脑”也可能因为失去公众信任而寸步难行。", "hue": 203, "date": "2026-10-15", "weekday": "周四"}, {"id": "news-2026-10-15-4", "domain": "具身智能", "title": "AI 看视频就会玩沙包？最新大模型让机器人学会投掷", "source": "X：Google (@Google)", "sourceUrl": "https://x.com/Google/status/2110428343950836212", "interpret": "这次 Google 的新版 AI“吉姆尼”厉害之处是它不再需要人类写代码，只需观看一段人玩沙包的录像，就能自己摸索出投掷规律。它先在电脑里模拟练习，最后成功指导一个人形机器人在现实中连续扔进 7 个球。这对行业意味着，以前花数月训练的机器人现在可能只需几天的观察就能掌握新技能，大幅降低开发成本。对普通人来说，未来家里的智能机器人或许能更灵活地理解并模仿各种人类动作，不管是做饭还是陪你互动，都能从“死记硬背”变成“举一反三”。", "hue": 217, "date": "2026-10-15", "weekday": "周四"}, {"id": "news-2026-10-15-5", "domain": "LLM", "title": "Claude Code 桌面版升级：多任务会话终于能统一管理了", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2110455911344931130", "interpret": "以前想用 AI 帮忙写代码，往往只能一次跟它聊一件事。现在 Claude Code 桌面版新增了“会话中心”，用户可以在主界面一次性启动、查看多个不同的对话，就像给聊天开了个文件夹一样。这个功能让 AI 不再容易忘事或跑题，大家能随时切换话题继续工作。虽然 OpenAI 也试过类似功能但没做成，但这步升级对创作者来说简直是福音。对于普通用户，这意味着写文档、查资料可以更顺畅地并行处理；对从业者而言，能把碎片化的对话整合起来，大幅降低整理思路的时间成本，让 AI 真正成为得力助手。", "hue": 203, "date": "2026-10-15", "weekday": "周四"}, {"id": "news-2026-10-16-1", "domain": "LLM", "title": "Bluesky 新功能让你像搭积木一样造出自己的社交小游戏", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/tech/1012374/bluesky-ai-attie-small-social-games-apps", "interpret": "最近开源社交平台 Bluesky 推出的 AI 助手 Attie 又升级了，现在不仅能帮你整理信息流，还能通过简单的文字指令，自动生成互动游戏、投票工具甚至自定义仪表盘。生成的内容直接就能打包成独立的小网页分享出去。这意味着之前需要程序员写代码、设计师画图才能做出来的迷你应用，普通人也能轻松创建。对于普通用户来说，这降低了制作个性化内容的门槛，大家能更方便地发起话题或组织活动；而对于从业者而言，这代表低代码时代的再次爆发，未来或许每个人都能以更低成本实现创意变现或快速搭建演示原型。", "hue": 205, "date": "2026-10-16", "weekday": "周五"}, {"id": "news-2026-10-16-2", "domain": "AI Agent", "title": "Perplexity 透露未来：AI 计算不止是租 GPU", "source": "X：Aravind Srinivas（Perplexity CEO） (@AravSrinivas)", "sourceUrl": "https://x.com/AravSrinivas/status/2110816382099325030", "interpret": "以前大家以为 AI 公司只靠出租显卡赚钱，但 Perplexity 最近说这不够用了。他们发现，光有算力还不行，还得自己造“大脑”：能免费分享聪明模型、能针对特定任务进行特训、还能像保安一样把数据关在安全屋里。这意味着未来的计算中心不能只是个冷冰冰的机房，而必须是一套包含智能软件和安全防护的完整生态。对普通用户来说，这意味着以后用的 AI 更懂你且更安全；对从业者而言，光买硬件不再是核心本事，怎么搭建这套“大脑”和“安保系统”才是决胜关键，谁能先做好这些配套，谁就能留住用户的真金白银。", "hue": 224, "date": "2026-10-16", "weekday": "周五"}, {"id": "news-2026-10-16-3", "domain": "AI认知算法", "title": "AI 巨头Anthropic“自找茬”，让独立专家团队自由查身", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/15/anthropic-is-letting-metr-researchers-look-under-the-hood-with-employee-level-access/", "interpret": "科技界出现了一个新鲜事，人工智能公司 Anthropic 主动给了一家名为 METR 的非营利研究机构开了大门，允许六名研究人员像内部员工一样使用公司的电脑和工具，专门检查它的 AI 模型是否安全、靠谱。这相当于一家大公司请外部“侦探”进去搜查自家后院，不仅让调查完全独立进行，还允许他们写出调查报告公之于众。对于普通用户来说，这意味着以后买到的 AI 服务会更安心，因为有个看不见的团队在时刻盯着有没有隐患；而对于搞技术的从业者而言，这种透明自查的态度会让行业风气变得更好，大家不再只忙着吹嘘技术有多牛，而是开始认真思考怎么让技术真正安全可靠地服务于人类。", "hue": 216, "date": "2026-10-16", "weekday": "周五"}, {"id": "news-2026-10-16-4", "domain": "世界模型", "title": "fal 发布 fal Worlds 实时 AI 世界生成平台", "source": "X：fal (@fal)", "sourceUrl": "https://x.com/fal/status/2110795863861674073", "interpret": "以前大家说的 AI 大多只能写文章或画图片，但今天 fal 推出了一款新产品叫 fal Worlds，它让 AI 真正变成了能跑起来的世界。在这里，你可以亲手创建一个角色和场景，然后走进自己的世界里去冒险；当你做出某个决定时，整个环境会像电影一样立刻做出反应并告诉你后果。目前大家还能直接试用几个最新的创意世界。这对普通人来说意味着，以后娱乐不再是被动刷视频，而是可以亲手参与创造的沉浸式故事体验；对从业者而言，这标志着 AI 从单纯的内容生成工具进化为了能够自主构建和演化的动态系统，技术门槛变高了，但能创造的价值也更大。”", "hue": 227, "date": "2026-10-16", "weekday": "周五"}, {"id": "news-2026-10-16-5", "domain": "LLM", "title": "没网也能玩 Pong？手机变“扩音器”实现麦克风联机", "source": "Simon Willison 博客", "sourceUrl": "https://simonwillison.net/2026/Oct/15/chirp-pong/", "interpret": "这次实验的核心是把两部手机变成了游戏机，但完全不需要联网或写代码。它利用了 AI 助手 Claude 的力量，只需在静态网页里集成麦克风接口，就能将声音转化为游戏信号。两位玩家需要对着麦克风发出特定的声音（chirp），AI 实时捕捉并分析这些音频来传输两人的操作状态，从而在一对一的 Pong 游戏中实现互动。这对普通人来说意味着技术变得极其友好：无需掌握编程知识，只要会用手机说话就能参与实验；对于从业者而言，它展示了生成式 AI 如何大幅降低开发门槛，让创意能快速落地为原型，证明复杂的交互游戏可以简单且低资源地搭建起来。", "hue": 211, "date": "2026-10-16", "weekday": "周五"}, {"id": "news-2026-10-17-1", "domain": "LLM", "title": "AI 大模型终于能一边看图一边写话了！", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2111181773078139118", "interpret": "OpenRouter 最近有个新玩法，让 AI 能像人一样先看图片再理解文字，或者把两者结合起来说话。以前咱们要是想问个带图的问题，得先存图、再生成文本，现在这些都变成同一个‘状态’里处理，一次最多发 4 张图。这对用户来说太香了，以后看个海报就能直接让 AI 写文案，不用分步骤操作。对于做设计、营销的从业者，这意味着工具更懂你，省去找各种插件折腾的时间，干活效率直接拉满。", "hue": 223, "date": "2026-10-17", "weekday": "周六"}, {"id": "news-2026-10-17-2", "domain": "AI认知算法", "title": "芯片别被锁死：黄仁勋喊话美企，靠“飞轮效应”赢过封锁", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2111179728237584716", "interpret": "英伟达 CEO 黄仁勋近日公开反对针对美国企业的芯片出口管制。他提出一个大胆的想法：与其把技术关在门外，不如让芯片像滚石一样到处滚动，形成自我增强的“飞轮”。他的逻辑很简单：卖得越多，企业赚得越丰厚；钱越多，研发就越快；研发越强，产品就更安全、更先进，最终美国因此保持全球领先地位。黄仁勋认为，针对稀土或武器这样的实物进行限制是必要的，但像芯片这样能促进财富流动的技术，应当广泛销售。这对普通老百姓来说意味着未来的电子产品可能更新更快、成本更低；对从事科技行业的人来说，则提示我们：在激烈的竞争中，开放合作带来的增长动力，往往比单纯的限制和封锁更能让一个国家走在时代前面。", "hue": 214, "date": "2026-10-17", "weekday": "周六"}, {"id": "news-2026-10-17-3", "domain": "AI Agent", "title": "美国 AI 公司 Reflection 让国产代码大模型都羡慕！", "source": "X：Arena (@arena)", "sourceUrl": "https://x.com/arena/status/2111162775007559685", "interpret": "简单来说，Reflection AI 最新推出的一个超大脑模型叫 Beam-1.0，它最近在一个专门测试 AI 自主完成任务的大擂台——Agent Arena 里杀出了一条血路。虽然这个榜单里整体分数波动不大，但它依然是美国开源世界里最强的那位，甚至在美国所有实验室里都排到第六名了，比大多数国内团队还要厉害。特别是在写代码这个最难的领域，它稳稳占了前二十强里的第二把交椅。更难得的是，它是唯一一个非中国背景却能进前二十五的选手，而且代码全部免费公开。这意味着什么？对普通用户来说，这意味着以后能免费用更强、更新鲜的工具去搞定编程难题；对程序员和行业从业者而言，这次上榜宣告了 AI 竞争已进入‘真刀真枪’的时代，那些只靠刷数据堆分数的套路行不通了，未来比拼的是谁能真正解决实际问题的能力。", "hue": 221, "date": "2026-10-17", "weekday": "周六"}, {"id": "news-2026-10-17-4", "domain": "具身智能", "title": "机器人不再只是冷冰冰的铁块，它能像人一样听懂你的笑声", "source": "X：Rohan Paul (@rohanpaul_ai)", "sourceUrl": "https://x.com/rohanpaul_ai/status/2111140476057481453", "interpret": "以前大家造机器人都只盯着工厂里搬砖、拧螺丝这种枯燥活儿，这次动态生物公司却把目光投向了客厅和卧室，推出了名叫 Hugo 的新一代人形机器人。它可不是那种只能按预设程序转圈的工具，而是真正学会了看人脸、听语调、跟动作。这意味着咱们的家以后可能不止有家电，还会有个能陪你聊天逗乐的伙伴。对普通人来说，这种陪伴感会让未来的生活更有温度；对从业者而言，机器人行业的赛道彻底从“工具”变成了“伴侣”，大家不再比拼谁力气大，而是要看谁能更懂人心。", "hue": 214, "date": "2026-10-17", "weekday": "周六"}, {"id": "news-2026-10-17-5", "domain": "LLM", "title": "AI 新大招：OpenRouter 上线 Span-02 决策引擎", "source": "X：OpenRouter (@OpenRouter)", "sourceUrl": "https://x.com/OpenRouter/status/2111181761267007709", "interpret": "OpenRouter 最新推出的 Span-02 模型终于登场了，它专门负责给 AI 下‘重大决定’。简单来说，之前的 AI 只能像聊天一样回答问题，而 Span-02 能帮企业判断该不该买服务器、要不要裁员，甚至如何配置最赚钱的广告方案。这对开发者和公司意味着什么？好处是太明显：只要改一行代码就能用上这个新功能，不用重新培训或更换整个系统，大大降低了使用门槛。以后你写一个复杂的商业决策工具，直接把这个模型塞进去就行，它能让你的产品从“能聊天”升级成“能拍板”，让普通人也能轻松搞定以前只有大公司才能解决的难题。", "hue": 223, "date": "2026-10-17", "weekday": "周六"}, {"id": "news-2026-10-18-1", "domain": "AI认知算法", "title": "AI 编辑器遭“偷师”式攻击，1.4% 用户数据或曝光", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2111536604351246541", "interpret": "近日，知名 AI 代码编辑器 OpenCode 发现自家被“偷师”，官方通报称发生了大规模安全漏洞攻击。简单来说，黑客利用一种叫“蒸馏攻击”的技术，试图模仿 AI 的回答风格来破解其内部模型，最终导致约 1.4% 的 Console 用户（这部分通常是连接了第三方服务的用户）面临潜在风险。目前公司已逐一发邮件通知这些用户。\n\n这件事意味着我们的代码生成助手可能不再完全安全。如果遭遇类似攻击，AI 不仅能复制自己的回答，甚至能反向推导出训练数据中的隐私信息，比如程序员习惯写哪类代码、项目里藏着什么商业机密。对于普通打工人，这提醒我们即使是常用的 AI 工具也要小心数据泄露；对于从业者，升级账号保护等级、不随意上传核心代码至云端服务已成为当务之急。", "hue": 203, "date": "2026-10-18", "weekday": "周日"}, {"id": "news-2026-10-18-2", "domain": "LLM", "title": "大模型内耗加剧：Replit 宣布切换 OpenAI 为默认引擎", "source": "TechCrunch：AI（RSS）", "sourceUrl": "https://techcrunch.com/2026/10/17/replit-is-no-longer-working-with-anthropic-ceo-says/", "interpret": "Replit 这家主打在线编程开发的巨头 recently 公开表示，因为成本过高、合作难以为继以及自家训练效果不佳等原因，决定停止使用此前合作的 AI 公司 Anthropic。从即日起，其平台上所有用户的默认人工智能助手将换成 OpenAI 的 ChatGPT。对于行业来说，这标志着两大巨头在模型服务上的博弈再次升级，开发者不再能从单一供应商身上免费或低成本获取优质算力。对普通用户而言，这意味着下次写代码遇到难题时，Replit 能更快速、稳定地给你提供基于 GPT 系列的答案，体验上或许会更顺手；但对于从业者来说，这种策略变动提醒我们，无论平台如何调整，选择合适且持续优化的底层模型能力才是核心竞争力的关键。", "hue": 216, "date": "2026-10-18", "weekday": "周日"}, {"id": "news-2026-10-18-3", "domain": "AI Agent", "title": "AI 时代软件工程的新矛盾：代码少了，人更累，钱没变多", "source": "X：Francois Chollet (@fchollet)", "sourceUrl": "https://x.com/fchollet/status/2111507711653564543", "interpret": "Chollet 发现了一个奇怪的现象：如今软件工程师比几年前更多，活也更多了，但他们基本不再动手写代码，而是盯着智能体干着。这就好比以前工厂工人自己操作机器，现在工人多了但只是负责指挥自动化工厂。虽然公司雇佣这些人的成本没降，利润也没明显好转，反而因为过度依赖自动化，某个环节的卡顿会把问题推到其他地方，导致整个流程卡住。这对普通打工人意味着，以后可能不需要靠多写代码来证明能力，而要擅长管理和协作；对从业者来说，必须学会盯着智能体的盲点，而不是只负责敲键盘。行业正在从“制造软件”转向“设计自动化系统”，核心不再是编写代码本身，而是如何避免系统内部的摩擦和瓶颈。", "hue": 222, "date": "2026-10-18", "weekday": "周日"}, {"id": "news-2026-10-18-4", "domain": "具身智能", "title": "AI 聊天机器人突然‘疯’了：连说话逻辑都跑偏", "source": "X：Nathan Lambert (@natolambert)", "sourceUrl": "https://x.com/natolambert/status/2111469383872921628", "interpret": "最近有科技博主吐槽自己用 AI 时遇到的荒诞事：本来只是简单问答，结果机器人开始胡言乱语、自相矛盾，完全控制不住。这就像给一台聪明的电脑装了个会出错的开关，它不仅答非所问，还能一本正经地胡说八道。\n这对行业来说是警钟，说明现在的 AI 还在‘学规矩’的阶段，容易在复杂场景下踩坑。对普通人而言，意味着上网问问题时要多留个心眼，别让 AI 带偏了主意；对从业者则提示：要想用得更稳当，还得给机器人 stricter 的‘纪律’，别让它们自由发挥到失控的地步。", "hue": 209, "date": "2026-10-18", "weekday": "周日"}, {"id": "news-2026-10-18-5", "domain": "LLM", "title": "AI 不再只讲冷冰冰的话，还能“半像人”地交流了！", "source": "X：Odyssey (@odysseyml)", "sourceUrl": "https://x.com/odysseyml/status/2111528316863979572", "interpret": "过去我们的 AI 要么只会说死板的数据，要么装作完全没人样地胡编乱造。现在科技巨头 Odyssey 发布了个新进展，就是让 AI 学会了“中间状态”，既不太死板也不太疯癫，能灵活得像个人在说话。这直接影响咱们以后怎么和电脑打交道，以后聊天、写东西甚至看病问药，AI 会更懂你的潜台词，不会总把话绕弯子。对普通人来说，这意味着用起智能工具更顺手、心里更有底；对从事 AI 工作的人来说，意味着以前那种非黑即白的训练方法行不通了，得学会怎么教机器把握那个“刚刚好”的尺度，行业玩法彻底变了。", "hue": 218, "date": "2026-10-18", "weekday": "周日"}, {"id": "news-2026-10-19-1", "domain": "LLM", "title": "OpenAI 新模型”Aurora”亮相：色彩更真实，香蕉兄弟受挑战", "source": "X：Testing Catalog (@testingcatalog)", "sourceUrl": "https://x.com/testingcatalog/status/2111894437877916032", "interpret": "这次大家终于能试用 OpenAI 最新的图像生成工具 Aurora 了。它现在正跑在专门的评测场上接受测试。简单来说，Aurora 做出来的图片更像真家伙，尤其是颜色搭配比之前的几个版本自然多了，那种“数码味”被洗得干干净净。这一变化意味着以前称霸市场的两个老对手 Nano Banana 和 GPT Image 将面临巨大压力，因为用户现在有了更好的选择。对于普通大众来说，这意味着以后刷出来的照片或画画的体验会更逼真；对于做相关工作的朋友而言，如果还在用旧工具，趁早换个更先进的或许能提升产出质量。", "hue": 203, "date": "2026-10-19", "weekday": "周一"}, {"id": "news-2026-10-19-2", "domain": "具身智能", "title": "费城女子因阻挡 Uber 配送机器人被捕", "source": "The Verge：AI（RSS）", "sourceUrl": "https://www.theverge.com/ai-artificial-intelligence/1013541/a-woman-was-arrested-in-philly-for-blocking-a-delivery-robot", "interpret": "近日，一名美国女子因在街上阻挡 Uber 的送餐机器而被警方带走，她拒绝让路是为了抗议机器人抢走人类的工作。这件事本质是科技巨头把自动化服务强行推入公共空间，结果撞上了公众对技术失控的抵触。对于普通人来说，这类冲突提醒我们：再先进的工具也需要考虑人的感受和安全，否则容易引发混乱；对于从事相关行业的从业者而言，这警示着企业在推广新产品时不能只顾效率而忽视社会影响，必须在技术与人文之间找到平衡，否则不仅会被抵制，还可能面临法律风险。", "hue": 205, "date": "2026-10-19", "weekday": "周一"}, {"id": "news-2026-10-19-3", "domain": "AI Agent", "title": "TinyFish 让搜索免费：AI 智能体读取网页的真实成本", "source": "MarkTechPost（RSS）", "sourceUrl": "https://www.marktechpost.com/2026/10/18/tinyfish-free-search-ai-agent-token-co const rail = document.getElementById('rail');
rail.innerHTML = DATA.timeline.map(t=>`

const weekOf = {};

// 按日期聚合
const sciByDay = {}; DATA.science.forEach(r=>{ (sciByDay[r.date]=sciByDay[r.date]||[]).push(r); });
const newsByDay = {}; DATA.news.forEach(r=>{ (newsByDay[r.date]=newsByDay[r.date]||[]).push(r); });
const allDays = Array.from(new Set([...Object.keys(sciByDay), ...Object.keys(newsByDay)]))
  .sort((a,b)=>b.localeCompare(a));

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', render);

function matchDomain(r){ return activeDomain==='全部' || r.domain===activeDomain; }
function matchKw(r, kw){
  if(!kw) return true;
  const hay = [r.title, r.domain, r.body||'', r.interpret||'', r.source||''].join(' ').toLowerCase();
  return hay.includes(kw.toLowerCase());
}

function sciCard(r, i){
  const dia = r.diagram ? `<div class="diagram">${esc(r.diagram)}</div>` : '';
  const ext = r.link ? `<a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">相关论文 →</a>` : '';
  return `<article class="scard" data-dom="${esc(r.domain)}">
    <div class="top">
      <span class="num">${i}</span>
      <span class="badge domain">${esc(r.domain)}</span>
      <span class="badge level">${esc(r.level||'入门')}</span>
    </div>
    <h3>${esc(r.title)}</h3>
    <p>${esc(r.body)}</p>
    ${dia}${ext?`<div class="foot">${ext}</div>`:''}
  </article>`;
}

function newsCard(r, i){
  const srcUrl = r.sourceUrl ? `<a class="link" href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">阅读原文 ↗</a>` : '';
  return `<article class="ncard" data-dom="${esc(r.domain)}">
    <div class="top">
      <span class="num">${i}</span>
      <span class="badge domain">${esc(r.domain)}</span>
      <span class="badge src" style="--h:${r.hue}">${esc(r.source||'AI 资讯')}</span>
    </div>
    <h3>${esc(r.title)}</h3>
    <div class="label">💡 通俗解读</div>
    <div class="interpret">${esc(r.interpret)}</div>
    <div class="foot">
      <span class="src">来源：${esc(r.source||'—')}</span>
      ${srcUrl}
    </div>
  </article>`;
}

const io = new IntersectionObserver((es)=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
},{threshold:0.1});

function render(){
  const kw = searchEl.value.trim();
  const content = document.getElementById('content');
  const sciDays = Object.keys(sciByDay).sort((a,b)=>b.localeCompare(a));
  const newsDays = Object.keys(newsByDay).sort((a,b)=>b.localeCompare(a));
  let sciHtml = '', newsHtml = '', sciN = 0, newsN = 0;

  sciDays.forEach(day=>{
    const list = (sciByDay[day]||[]).filter(r=>matchDomain(r)&&matchKw(r,kw));
    if(!list.length) return;
    sciN += list.length;
    sciHtml += `<section class="day-block" id="sci-day-${day}">
      <div class="day-label">
        <span class="dl-date">${day}</span>
        <span class="dl-week">${weekOf[day]||''}</span>
        <span class="dl-count">${list.length} 条</span>
      </div>${list.map((r,i)=>sciCard(r,i+1)).join('')}</section>`;
  });
  newsDays.forEach(day=>{
    const list = (newsByDay[day]||[]).filter(r=>matchDomain(r)&&matchKw(r,kw));
    if(!list.length) return;
    newsN += list.length;
    newsHtml += `<section class="day-block" id="news-day-${day}">
      <div class="day-label">
        <span class="dl-date">${day}</span>
        <span class="dl-week">${weekOf[day]||''}</span>
        <span class="dl-count">${list.length} 条</span>
      </div>${list.map((r,i)=>newsCard(r,i+1)).join('')}</section>`;
  });

  if(!sciN && !newsN){
    content.innerHTML = `<div class="empty">没有匹配的条目，换个关键词或领域试试～</div>`;
    rail.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
    return;
  }

  content.innerHTML =
    `<div class="module-h"><span class="ico">📘</span><div>AI Agent 入门科普
       <div class="desc">循序渐进：概念 → 架构 → 工具 → 实战 · 每日 1-2 条</div></div>
       <span class="cnt">${sciN} 条</span></div>${sciHtml}
     <div class="module-h"><span class="ico">📰</span><div>每日 5 条新闻 &amp; 解读
       <div class="desc">精选当日 AI 行业 / 产品热点 · 通俗解读 · 附原文链接</div></div>
       <span class="cnt">${newsN} 条</span></div>${newsHtml}`;

  document.querySelectorAll('.scard,.ncard').forEach(c=>io.observe(c));

  // 时间轴点击跳转：优先跳科普模块的日期块，否则跳新闻模块
  rail.querySelectorAll('.node').forEach(n=>{
    const d = n.dataset.target.replace(/^day-/,'');
    n.onclick = ()=>{
      const el = document.getElementById('sci-day-'+d) || document.getElementById('news-day-'+d);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  document.querySelectorAll('.content section').forEach(s=>secObserver.observe(s));
  rail.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
}

const secObserver = new IntersectionObserver((es)=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const d = (e.target.id||'').replace(/^(sci|news)-day-/, '');
      document.querySelectorAll('.node').forEach(x=>x.classList.remove('active'));
      const n = document.querySelector(`.node[data-target="day-${d}"]`);
      if(n) n.classList.add('active');
    }
  });
},{rootMargin:'-20% 0px -70% 0px', threshold:0});
